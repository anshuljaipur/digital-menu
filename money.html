<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family & Broker Investment Ledger</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #27ae60;
            --bg: #ecf0f1;
            --danger: #c0392b;
            --info: #2980b9;
            --warning: #f39c12;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: var(--primary); }
        
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
        .login-box h2 { margin-top: 0; margin-bottom: 20px; }
        .login-box input { margin-bottom: 15px; padding: 12px; font-size: 1em; }
        .login-box button { padding: 12px; font-size: 1.1em; }
        .error-msg { color: var(--danger); font-size: 0.9em; margin-bottom: 15px; display: none; }
        
        #mainApp { display: none; }
        .app-header { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 20px auto; }
        .btn-logout { background-color: var(--danger); width: auto; padding: 8px 15px; margin: 0; }
        
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1, h2, h3 { margin-top: 0; color: var(--primary); }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
        input, select, button { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #bdc3c7; border-radius: 4px; box-sizing: border-box; }
        
        button { background-color: var(--accent); color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #219653; }
        
        .form-actions { display: flex; gap: 10px; }
        .btn-reset { background-color: #95a5a6; }
        .btn-reset:hover { background-color: #7f8c8d; }
        
        .btn-export { background-color: var(--primary); }
        .btn-export:hover { background-color: #1a252f; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        th, td { border: 1px solid #bdc3c7; padding: 10px; text-align: left; }
        th { background-color: var(--secondary); color: white; cursor: pointer; user-select: none; position: relative; }
        th:hover { background-color: #2c3e50; }
        th.sort-asc::after { content: " ▲"; font-size: 0.8em; position: absolute; right: 5px; }
        th.sort-desc::after { content: " ▼"; font-size: 0.8em; position: absolute; right: 5px; }
        
            tfoot tr { background-color: #f8f9fa; font-weight: bold; border-top: 2px solid var(--secondary); }
        
        .positive { color: var(--accent); font-weight: bold; }
        .negative { color: var(--danger); font-weight: bold; }
        
        .action-btn { padding: 4px 8px; margin-bottom: 0; font-size: 0.8em; width: auto; display: inline-block; border-radius: 3px; cursor: pointer;}
        .btn-edit { background-color: var(--warning); margin-right: 5px; color: white; border: none;}
        .btn-edit:hover { background-color: #d68910; }
        .btn-delete { background-color: var(--danger); color: white; border: none;}
        .btn-delete:hover { background-color: #a93226; }
        
        .filter-group { display: flex; gap: 10px; align-items: center; background: var(--bg); padding: 10px; border-radius: 6px;}
        .filter-group input, .filter-group select, .filter-group button { margin-bottom: 0; width: auto; }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .filter-group { flex-wrap: wrap; }
            .form-actions { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <h2>Secure Ledger Access</h2>
            <div id="loginError" class="error-msg">Invalid email or password.</div>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email Address" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>
        </div>
    </div>

    <div id="mainApp">
        <div class="app-header">
            <h1 style="margin: 0;">Financial Tracking Ledger</h1>
            <button class="btn-logout" id="btnLogout">Secure Logout</button>
        </div>

        <div class="container">
            <div>
                <div class="card">
                    <h2>Add Transaction</h2>
                    <form id="txnForm">
                        <label>Date</label>
                        <input type="date" id="txnDate" required>
                        
                        <label>From (Sender)</label>
                        <select id="txnFrom" required></select>
                        
                        <label>To (Receiver)</label>
                        <select id="txnTo" required></select>
                        
                        <label>Amount (₹)</label>
                        <input type="number" id="txnAmount" min="1" step="0.01" required>
                        
                        <label>Remarks / Purpose</label>
                        <input type="text" id="txnRemarks" placeholder="e.g., Transfer to broker">
                        
                        <div class="form-actions">
                            <button type="submit">Record Entry</button>
                            <button type="button" class="btn-reset" id="btnResetForm">Reset Form</button>
                        </div>
                    </form>
                </div>

                <div class="card">
                    <h2>Create New Entity</h2>
                    <form id="memberForm">
                        <label>Account Name</label>
                        <input type="text" id="newMemberName" placeholder="e.g., Spouse Name, Sub-broker Account" required>
                        <button type="submit">Add New Entity</button>
                    </form>
                </div>
            </div>

            <div>
                <div class="card">
                    <h2>Net Balances & Entity Management</h2>
                    <p style="font-size: 0.8em; color: #7f8c8d; margin-bottom: 15px;">
                        Positive assets sit under <b>Cr Balance</b>. Liabilities or payouts sit under <b>Dr Balance</b>. Click column headers to sort profiles.
                    </p>
                    <div id="balanceContainer" style="overflow-x:auto;"></div>
                </div>

                <div class="card">
                    <h2>Ledger Entries & Statements</h2>
                    
                    <div class="filter-group">
                        <label style="margin:0;">From:</label>
                        <input type="date" id="filterStart" onchange="renderTransactions()">
                        <label style="margin:0;">To:</label>
                        <input type="date" id="filterEnd" onchange="renderTransactions()">
                        <select id="ledgerFilter" onchange="renderTransactions()">
                            <option value="ALL">View All Transactions</option>
                        </select>
                        <button class="btn-export" onclick="generatePDF()">Export PDF</button>
                    </div>
                    
                    <div style="overflow-x:auto; margin-top: 15px;">
                        <table id="txnTable">
                            <thead></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // !!! PASTE YOUR FIREBASE CONFIGURATION HERE !!!
        const firebaseConfig = {
            apiKey: "AIzaSyBS5JfRslGIXFLbrSz6SFfOa28TnVJIaGo",
            authDomain: "finance-6191d.firebaseapp.com",
            projectId: "finance-6191d",
            storageBucket: "finance-6191d.firebasestorage.app",
            messagingSenderId: "835382828403",
            appId: "1:835382828403:web:367d58760781c5523d3906",
            measurementId: "G-C00485V7YY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app); 

        let members = ["Eureka PAPA", "Eureka Akku", "Gopal Krishan Goyal", "Ankita Goyal", "Maa"];
        let transactions = [];

        // Sorting Global State Trackers
        let balanceSortKey = 'name';
        let balanceSortDir = 'asc';
        let ledgerSortKey = 'date';
        let ledgerSortDir = 'desc';

        function formatDateToYYYYMMDD(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // --- Authentication Watcher ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                initData(); 
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)
                .catch(() => { document.getElementById('loginError').style.display = 'block'; });
        });

        document.getElementById('btnLogout').addEventListener('click', () => { signOut(auth); });

        // --- Setup Operational Parameters ---
        async function initData() {
            document.getElementById('txnDate').valueAsDate = new Date();
            
            // Auto calculate Indian Financial Year Bounds (Starts April 1)
            const today = new Date();
            let startYear = today.getFullYear();
            if (today.getMonth() < 3) { startYear--; }
            const firstDayOfFY = new Date(startYear, 3, 1);
            
            document.getElementById('filterStart').value = formatDateToYYYYMMDD(firstDayOfFY);
            document.getElementById('filterEnd').value = formatDateToYYYYMMDD(today);

            try {
                const docRef = doc(db, "ledgerData", "main");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.members) members = data.members;
                    if (data.transactions) transactions = data.transactions;
                }
            } catch (error) { console.error("Database sync failed:", error); }
            updateUI();
        }

        async function saveData() {
            try { await setDoc(doc(db, "ledgerData", "main"), { members, transactions }); } 
            catch (error) { console.error("Backup tracking failure:", error); }
        }

        window.updateUI = function() {
            updateDropdowns();
            renderBalances();
            renderTransactions();
        }

        function updateDropdowns() {
            const fromSelect = document.getElementById('txnFrom');
            const toSelect = document.getElementById('txnTo');
            const ledgerFilter = document.getElementById('ledgerFilter');
            const currentFilter = ledgerFilter.value;
            
            let optionsHTML = members.map(m => `<option value="${m}">${m}</option>`).join('');
            fromSelect.innerHTML = `<option value="">Select Sender...</option>` + optionsHTML;
            toSelect.innerHTML = `<option value="">Select Receiver...</option>` + optionsHTML;
            ledgerFilter.innerHTML = `<option value="ALL">View All Transactions</option>` + optionsHTML;
            ledgerFilter.value = currentFilter && members.includes(currentFilter) ? currentFilter : "ALL";
        }

        // --- Form Resets Engine (Requirement 1) ---
        document.getElementById('btnResetForm').addEventListener('click', () => {
            document.getElementById('txnForm').reset();
            document.getElementById('txnDate').valueAsDate = new Date();
        });

        // --- Balance Matrix Sorting Logic (Requirement 2 & 3 & 4) ---
        window.toggleBalanceSort = function(key) {
            if (balanceSortKey === key) {
                balanceSortDir = balanceSortDir === 'asc' ? 'desc' : 'asc';
            } else {
                balanceSortKey = key;
                balanceSortDir = 'asc';
            }
            renderBalances();
        };

        function renderBalances() {
            const container = document.getElementById('balanceContainer');
            
            let accountBalances = {};
            members.forEach(m => accountBalances[m] = 0);
            transactions.forEach(t => {
                if(accountBalances[t.from] !== undefined) accountBalances[t.from] -= t.amount;
                if(accountBalances[t.to] !== undefined) accountBalances[t.to] += t.amount;
            });

            let balanceRecords = members.map(name => {
                const balanceVal = accountBalances[name];
                return {
                    name: name,
                    cr: balanceVal >= 0 ? balanceVal : 0,
                    dr: balanceVal < 0 ? Math.abs(balanceVal) : 0,
                    raw: balanceVal
                };
            });

            balanceRecords.sort((a, b) => {
                let valA = a[balanceSortKey];
                let valB = b[balanceSortKey];
                
                if (valA === valB) {
                    return balanceSortDir === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
                }
                if (typeof valA === 'string') {
                    return balanceSortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else {
                    return balanceSortDir === 'asc' ? valA - valB : valB - valA;
                }
            });

            let totalCr = 0;
            let totalDr = 0;

            let html = `
            <table>
                <thead>
                    <tr>
                        <th class="${balanceSortKey === 'name' ? 'sort-' + balanceSortDir : ''}" onclick="toggleBalanceSort('name')">Account Name</th>
                        <th style="text-align: right;" class="${balanceSortKey === 'cr' ? 'sort-' + balanceSortDir : ''}" onclick="toggleBalanceSort('cr')">Cr Balance (Assets)</th>
                        <th style="text-align: right;" class="${balanceSortKey === 'dr' ? 'sort-' + balanceSortDir : ''}" onclick="toggleBalanceSort('dr')">Dr Balance (Owed)</th>
                        <th style="text-align: center;">Modify Account</th>
                    </tr>
                </thead>
                <tbody>
            `;

            balanceRecords.forEach(rec => {
                totalCr += rec.cr;
                totalDr += rec.dr;

                html += `
                    <tr>
                        <td><b>${rec.name}</b></td>
                        <td style="text-align: right;" class="positive">${rec.cr > 0 ? '₹' + rec.cr.toLocaleString('en-IN', {minimumFractionDigits: 2}) : '-'}</td>
                        <td style="text-align: right;" class="negative">${rec.dr > 0 ? '₹' + rec.dr.toLocaleString('en-IN', {minimumFractionDigits: 2}) : '-'}</td>
                        <td style="text-align: center;">
                            <button class="action-btn btn-edit" onclick="editMember('${rec.name}')">Edit</button>
                            <button class="action-btn btn-delete" onclick="deleteMember('${rec.name}')">Del</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                </tbody>
                <tfoot>
                    <tr>
                        <td>TOTAL ACCOUNTS SUM</td>
                        <td style="text-align: right;" class="positive">₹${totalCr.toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
                        <td style="text-align: right;" class="negative">₹${totalDr.toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>`;
            
            container.innerHTML = html;
        }

        // --- Sorting Hooks for Transaction Ledger ---
        window.toggleLedgerSort = function(key) {
            if (ledgerSortKey === key) {
                ledgerSortDir = ledgerSortDir === 'asc' ? 'desc' : 'asc';
            } else {
                ledgerSortKey = key;
                ledgerSortDir = 'asc';
            }
            renderTransactions();
        };

        function getFilteredTransactions(acctFilter) {
            const startVal = document.getElementById('filterStart').value;
            const endVal = document.getElementById('filterEnd').value;
            
            return transactions.filter(t => {
                if (acctFilter !== 'ALL' && t.from !== acctFilter && t.to !== acctFilter) return false;
                if (startVal && t.date < startVal) return false;
                if (endVal && t.date > endVal) return false;
                return true;
            });
        }

        window.renderTransactions = function() {
            const filter = document.getElementById('ledgerFilter').value;
            const thead = document.querySelector('#txnTable thead');
            const tbody = document.querySelector('#txnTable tbody');
            const filteredTxns = getFilteredTransactions(filter);

            const getSortClass = (key) => ledgerSortKey === key ? `class="sort-${ledgerSortDir}"` : '';

            if (filter === 'ALL') {
                thead.innerHTML = `
                    <tr>
                        <th ${getSortClass('date')} onclick="toggleLedgerSort('date')">Date</th>
                        <th ${getSortClass('from')} onclick="toggleLedgerSort('from')">From</th>
                        <th ${getSortClass('to')} onclick="toggleLedgerSort('to')">To</th>
                        <th ${getSortClass('amount')} onclick="toggleLedgerSort('amount')">Amount</th>
                        <th ${getSortClass('remarks')} onclick="toggleLedgerSort('remarks')">Remarks</th>
                        <th>Actions</th>
                    </tr>`;
                
                filteredTxns.sort((a, b) => {
                    let valA = a[ledgerSortKey];
                    let valB = b[ledgerSortKey];
                    if (valA === valB) {
                        return ledgerSortDir === 'asc' ? a.id - b.id : b.id - a.id;
                    }
                    if (typeof valA === 'string') {
                        return ledgerSortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                    } else {
                        return ledgerSortDir === 'asc' ? valA - valB : valB - valA;
                    }
                });

                tbody.innerHTML = filteredTxns.map(t => `
                    <tr>
                        <td>${t.date}</td><td>${t.from}</td><td>${t.to}</td>
                        <td>₹${t.amount.toLocaleString('en-IN')}</td><td>${t.remarks}</td>
                        <td>
                            <button class="action-btn btn-edit" onclick="editTransaction(${t.id})">Edit</button>
                            <button class="action-btn btn-delete" onclick="deleteTransaction(${t.id})">Del</button>
                        </td>
                    </tr>
                `).join('');
            } else {
                thead.innerHTML = `
                    <tr>
                        <th ${getSortClass('date')} onclick="toggleLedgerSort('date')">Date</th>
                        <th ${getSortClass('particulars')} onclick="toggleLedgerSort('particulars')">Particulars</th>
                        <th ${getSortClass('remarks')} onclick="toggleLedgerSort('remarks')">Remarks</th>
                        <th ${getSortClass('inAmt')} onclick="toggleLedgerSort('inAmt')">In (Credit)</th>
                        <th ${getSortClass('outAmt')} onclick="toggleLedgerSort('outAmt')">Out (Debit)</th>
                        <th ${getSortClass('balSnapshot')} onclick="toggleLedgerSort('balSnapshot')">Running Balance</th>
                        <th>Actions</th>
                    </tr>`;
                
                // FIXED Chronological sequence calculation engine using internal unique incremental ID tie-breakers
                const chronologicalList = [...filteredTxns].sort((a, b) => {
                    if (a.date !== b.date) return a.date.localeCompare(b.date);
                    return a.id - b.id; 
                });

                const startVal = document.getElementById('filterStart').value;
                let runningBalance = 0;
                
                if (startVal) {
                    transactions.forEach(t => {
                        if (t.date < startVal) {
                            if (t.from === filter) runningBalance -= t.amount;
                            if (t.to === filter) runningBalance += t.amount;
                        }
                    });
                }
                
                let mappedRows = chronologicalList.map(t => {
                    let inAmt = 0, outAmt = 0, particulars = '';
                    if (t.from === filter) {
                        outAmt = t.amount;
                        runningBalance -= t.amount;
                        particulars = `To: ${t.to}`;
                    } else {
                        inAmt = t.amount;
                        runningBalance += t.amount;
                        particulars = `From: ${t.from}`;
                    }
                    return {
                        id: t.id,
                        date: t.date,
                        particulars: particulars,
                        remarks: t.remarks,
                        inAmt: inAmt,
                        outAmt: outAmt,
                        balSnapshot: runningBalance
                    };
                });

                // Display Sort Engine incorporating directional fallback matching the user's view
                mappedRows.sort((a, b) => {
                    let valA = a[ledgerSortKey];
                    let valB = b[ledgerSortKey];
                    if (valA === valB) {
                        return ledgerSortDir === 'asc' ? a.id - b.id : b.id - a.id;
                    }
                    if (typeof valA === 'string') {
                        return ledgerSortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                    } else {
                        return ledgerSortDir === 'asc' ? valA - valB : valB - valA;
                    }
                });

                tbody.innerHTML = mappedRows.map(row => `
                    <tr>
                        <td>${row.date}</td><td>${row.particulars}</td><td>${row.remarks}</td>
                        <td class="positive">${row.inAmt > 0 ? '₹'+row.inAmt.toLocaleString('en-IN') : '-'}</td>
                        <td class="negative">${row.outAmt > 0 ? '₹'+row.outAmt.toLocaleString('en-IN') : '-'}</td>
                        <td><strong>₹${row.balSnapshot.toLocaleString('en-IN', {minimumFractionDigits: 2})}</strong></td>
                        <td>
                            <button class="action-btn btn-edit" onclick="editTransaction(${row.id})">Edit</button>
                            <button class="action-btn btn-delete" onclick="deleteTransaction(${row.id})">Del</button>
                        </td>
                    </tr>`).join('');
            }
        }

        // --- Transaction Management ---
        document.getElementById('txnForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const date = document.getElementById('txnDate').value;
            const from = document.getElementById('txnFrom').value;
            const to = document.getElementById('txnTo').value;
            const amount = parseFloat(document.getElementById('txnAmount').value);
            const remarks = document.getElementById('txnRemarks').value;

            if (from === to) { alert("Sender and Receiver cannot be the same."); return; }

            // Strict case-insensitive type-safe duplicate lookup
            const isDuplicate = transactions.some(t => 
                t.from.trim().toLowerCase() === from.trim().toLowerCase() && 
                t.to.trim().toLowerCase() === to.trim().toLowerCase() && 
                Number(t.amount) === Number(amount) && 
                t.date === date
            );

            if (isDuplicate) {
                if (!confirm(`⚠️ PLEASE CHECK:\n\nA transaction for ₹${amount} from "${from}" to "${to}" on ${date} already exists.\n\nAre you sure you want to record a duplicate entry?`)) {
                    return;
                }
            }

            transactions.push({ id: Date.now(), date, from, to, amount, remarks });
            await saveData();
            updateUI();
            
            document.getElementById('txnAmount').value = '';
            document.getElementById('txnRemarks').value = '';
        });

        window.editTransaction = async function(id) {
            const txn = transactions.find(t => t.id === id);
            if (!txn) return;

            const newDate = prompt("Edit Date (YYYY-MM-DD):", txn.date); if (newDate === null) return; 
            const newAmountStr = prompt("Edit Amount (₹):", txn.amount); if (newAmountStr === null) return; 
            const newAmount = parseFloat(newAmountStr);
            const newRemarks = prompt("Edit Remarks:", txn.remarks); if (newRemarks === null) return;

            if (isNaN(newAmount) || newAmount <= 0) { alert("Invalid amount."); return; }

            txn.date = newDate; txn.amount = newAmount; txn.remarks = newRemarks;
            await saveData(); updateUI();
        };

        window.deleteTransaction = async function(id) {
            if (confirm("Delete this transaction permanently?")) {
                transactions = transactions.filter(t => t.id !== id);
                await saveData(); updateUI();
            }
        };

        document.getElementById('memberForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newName = document.getElementById('newMemberName').value.trim();
            if (newName && !members.includes(newName)) {
                members.push(newName);
                await saveData(); updateUI();
                document.getElementById('newMemberName').value = '';
            } else { alert("Name already active or invalid."); }
        });

        window.editMember = async function(oldName) {
            const newName = prompt(`Enter new profile title for "${oldName}":`, oldName);
            if (!newName || newName.trim() === "" || newName === oldName) return;
            const trimmed = newName.trim();
            if (members.includes(trimmed)) return alert("Account name matches existing record.");

            members[members.indexOf(oldName)] = trimmed;
            transactions.forEach(t => {
                if (t.from === oldName) t.from = trimmed;
                if (t.to === oldName) t.to = trimmed;
            });
            await saveData(); updateUI();
        };

        window.deleteMember = async function(name) {
            if (transactions.some(t => t.from === name || t.to === name)) {
                return alert("Cannot drop active entities. Reassign or clear historical records linked to this account first.");
            }
            if (confirm(`Drop account profile "${name}"?`)) {
                members = members.filter(m => m !== name);
                await saveData(); updateUI();
            }
        };

        // --- Financial PDF Engine Extraction ---
        window.generatePDF = function() {
            const filter = document.getElementById('ledgerFilter').value;
            if(filter === 'ALL') { return alert("Please isolate a specific profile to pull an official statement."); }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const entityTxns = getFilteredTransactions(filter).sort((a, b) => {
                if (a.date !== b.date) return a.date.localeCompare(b.date);
                return a.id - b.id;
            });
            const startVal = document.getElementById('filterStart').value;
            let runningBalance = 0;

            if (startVal) {
                transactions.forEach(t => {
                    if (t.date < startVal) {
                        if (t.from === filter) runningBalance -= t.amount;
                        if (t.to === filter) runningBalance += t.amount;
                    }
                });
            }

            doc.setFontSize(18); doc.text(`Account Statement: ${filter}`, 14, 20);
            doc.setFontSize(10); doc.text(`Generated: ${new Date().toLocaleDateString('en-IN')}`, 14, 28);
            doc.text(`Accounting Period: ${startVal || 'Inception'} to ${document.getElementById('filterEnd').value || 'Present'}`, 14, 34);
            if (startVal) doc.text(`Opening Balance Assets: INR ${runningBalance.toFixed(2)}`, 14, 40);

            const tableData = entityTxns.map(t => {
                let d=0, c=0, type="";
                if (t.from === filter) { d = t.amount; runningBalance -= t.amount; type = `To ${t.to}`; } 
                else { c = t.amount; runningBalance += t.amount; type = `From ${t.from}`; }
                return [ t.date, type, t.remarks, d>0 ? d.toFixed(2) : "-", c>0 ? c.toFixed(2) : "-", runningBalance.toFixed(2) ];
            });

            doc.autoTable({
                startY: startVal ? 45 : 40,
                head: [['Date', 'Particulars', 'Remarks', 'Debit (Out)', 'Credit (In)', 'Balance']],
                body: tableData,
                theme: 'striped',
                headStyles: { fillColor: [44, 62, 80] }
            });
            doc.save(`${filter}_Statement_${new Date().getTime()}.pdf`);
        }

        initData();
    </script>
</body>
</html>
