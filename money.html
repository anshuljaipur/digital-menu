<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family & Broker Investment Ledger</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #27ae60;
            --bg: #ecf0f1;
            --danger: #c0392b;
            --info: #2980b9;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: var(--primary); }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1, h2, h3 { margin-top: 0; color: var(--primary); }
        h1 { grid-column: 1 / -1; text-align: center; margin-bottom: 20px;}
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
        input, select, button { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #bdc3c7; border-radius: 4px; box-sizing: border-box; }
        button { background-color: var(--accent); color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #219653; }
        
        .btn-export { background-color: var(--primary); }
        .btn-export:hover { background-color: #1a252f; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        th, td { border: 1px solid #bdc3c7; padding: 10px; text-align: left; }
        th { background-color: var(--secondary); color: white; }
        
        .positive { color: var(--accent); font-weight: bold; }
        .negative { color: var(--danger); font-weight: bold; }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .balance-card { border: 1px solid #bdc3c7; padding: 15px; border-radius: 6px; text-align: center; }
        .balance-card h3 { margin: 0 0 10px 0; font-size: 1.1em; }
        
        .member-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #ecf0f1; font-weight: bold; }
        
        /* Action Buttons */
        .action-btn { padding: 4px 8px; margin-bottom: 0; font-size: 0.8em; width: auto; display: inline-block; border-radius: 3px; cursor: pointer;}
        .btn-edit { background-color: #f39c12; margin-right: 5px; color: white; border: none;}
        .btn-edit:hover { background-color: #d68910; }
        .btn-delete { background-color: var(--danger); color: white; border: none;}
        .btn-delete:hover { background-color: #a93226; }
        .member-actions { display: flex; gap: 5px; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-top: 30px;}
        .header-flex select { width: 250px; margin-bottom: 0; }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .header-flex { flex-direction: column; align-items: flex-start; gap: 10px;}
        }
    </style>
</head>
<body>

    <h1>Financial Tracking Ledger</h1>

    <div class="container">
        <div>
            <div class="card">
                <h2>Add Transaction</h2>
                <form id="txnForm">
                    <label>Date</label>
                    <input type="date" id="txnDate" required>
                    
                    <label>From (Sender)</label>
                    <select id="txnFrom" required></select>
                    
                    <label>To (Receiver)</label>
                    <select id="txnTo" required></select>
                    
                    <label>Amount (₹)</label>
                    <input type="number" id="txnAmount" min="1" step="0.01" required>
                    
                    <label>Remarks / Purpose</label>
                    <input type="text" id="txnRemarks" placeholder="e.g., IPO Application, Margin Transfer">
                    
                    <button type="submit">Record Transaction</button>
                </form>
            </div>

            <div class="card">
                <h2>Manage Entities</h2>
                <form id="memberForm">
                    <label>Add New Member / Account</label>
                    <input type="text" id="newMemberName" placeholder="e.g., Bank Acct, Broker, Name" required>
                    <button type="submit">Add Entity</button>
                </form>

                <h3 style="margin-top: 20px; font-size: 1.1em; border-bottom: 2px solid var(--secondary); padding-bottom: 5px;">Current Entities</h3>
                <div id="membersList">
                    </div>
            </div>
        </div>

        <div>
            <div class="card">
                <h2>Net Balances</h2>
                <p style="font-size: 0.8em; color: #7f8c8d;">Positive balance means the entity holds funds. Negative means they have sent more than received.</p>
                <div class="dashboard-grid" id="balanceGrid">
                    </div>
            </div>

            <div class="card">
                <h2>Generate PDF Statement</h2>
                <div style="display: flex; gap: 10px;">
                    <select id="statementSelect" style="margin-bottom: 0;"></select>
                    <button class="btn-export" style="margin-bottom: 0;" onclick="generatePDF()">Export to PDF</button>
                </div>

                <div class="header-flex">
                    <h3>Ledger View</h3>
                    <select id="ledgerFilter" onchange="renderTransactions()">
                        <option value="ALL">View All Transactions</option>
                        </select>
                </div>
                
                <div style="overflow-x:auto;">
                    <table id="txnTable">
                        <thead>
                            </thead>
                        <tbody>
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // !!! PASTE YOUR FIREBASE CONFIGURATION HERE !!!
        const firebaseConfig = {
            apiKey: "AIzaSyBS5JfRslGIXFLbrSz6SFfOa28TnVJIaGo",
            authDomain: "finance-6191d.firebaseapp.com",
            projectId: "finance-6191d",
            storageBucket: "finance-6191d.firebasestorage.app",
            messagingSenderId: "835382828403",
            appId: "1:835382828403:web:367d58760781c5523d3906",
            measurementId: "G-C00485V7YY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let members = ["Anshul", "Rishaan", "Eureka Broker", "IPO Escrow"];
        let transactions = [];

        // --- Initialization & Storage ---
        async function init() {
            document.getElementById('txnDate').valueAsDate = new Date();
            try {
                const docRef = doc(db, "ledgerData", "main");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.members) members = data.members;
                    if (data.transactions) transactions = data.transactions;
                }
            } catch (error) {
                console.error("Firebase load error:", error);
                alert("Database load failed. Check internet/console.");
            }
            updateUI();
        }

        async function saveData() {
            try {
                await setDoc(doc(db, "ledgerData", "main"), { members, transactions });
            } catch (error) {
                console.error("Firebase save error:", error);
                alert("Save failed. Check connection.");
            }
        }

        // --- Core UI Updates ---
        window.updateUI = function() {
            updateDropdowns();
            renderMembersList();
            renderBalances();
            renderTransactions();
        }

        function updateDropdowns() {
            const fromSelect = document.getElementById('txnFrom');
            const toSelect = document.getElementById('txnTo');
            const stmtSelect = document.getElementById('statementSelect');
            const ledgerFilter = document.getElementById('ledgerFilter');
            
            const currentFilter = ledgerFilter.value;
            let optionsHTML = members.map(m => `<option value="${m}">${m}</option>`).join('');
            
            fromSelect.innerHTML = `<option value="">Select Sender...</option>` + optionsHTML;
            toSelect.innerHTML = `<option value="">Select Receiver...</option>` + optionsHTML;
            stmtSelect.innerHTML = optionsHTML;
            
            ledgerFilter.innerHTML = `<option value="ALL">View All Transactions</option>` + optionsHTML;
            ledgerFilter.value = currentFilter && members.includes(currentFilter) ? currentFilter : "ALL";
        }

        function renderMembersList() {
            const list = document.getElementById('membersList');
            list.innerHTML = members.map(m => `
                <div class="member-item">
                    <span>${m}</span>
                    <div class="member-actions">
                        <button class="action-btn btn-edit" onclick="editMember('${m}')">Edit</button>
                        <button class="action-btn btn-delete" onclick="deleteMember('${m}')">Del</button>
                    </div>
                </div>
            `).join('');
        }

        function renderBalances() {
            const grid = document.getElementById('balanceGrid');
            let balances = {};
            members.forEach(m => balances[m] = 0);

            transactions.forEach(t => {
                if(balances[t.from] !== undefined) balances[t.from] -= t.amount;
                if(balances[t.to] !== undefined) balances[t.to] += t.amount;
            });
            
            grid.innerHTML = members.map(m => {
                const bal = balances[m];
                const cls = bal >= 0 ? 'positive' : 'negative';
                return `
                    <div class="balance-card">
                        <h3>${m}</h3>
                        <div class="${cls}">₹${bal.toLocaleString('en-IN', {minimumFractionDigits: 2})}</div>
                    </div>
                `;
            }).join('');
        }

        // --- Render Ledger Table ---
        window.renderTransactions = function() {
            const filter = document.getElementById('ledgerFilter').value;
            const thead = document.querySelector('#txnTable thead');
            const tbody = document.querySelector('#txnTable tbody');
            let html = '';

            if (filter === 'ALL') {
                thead.innerHTML = `<tr><th>Date</th><th>From</th><th>To</th><th>Amount</th><th>Remarks</th><th>Actions</th></tr>`;
                const sorted = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
                
                html = sorted.map(t => `
                    <tr>
                        <td>${t.date}</td><td>${t.from}</td><td>${t.to}</td>
                        <td>₹${t.amount.toLocaleString('en-IN')}</td><td>${t.remarks}</td>
                        <td>
                            <button class="action-btn btn-edit" onclick="editTransaction(${t.id})">Edit</button>
                            <button class="action-btn btn-delete" onclick="deleteTransaction(${t.id})">Del</button>
                        </td>
                    </tr>
                `).join('');
            } else {
                thead.innerHTML = `<tr><th>Date</th><th>Particulars</th><th>Remarks</th><th>In (Credit)</th><th>Out (Debit)</th><th>Balance</th><th>Actions</th></tr>`;
                
                // Sort ascending to calculate running balance properly
                const filtered = transactions.filter(t => t.from === filter || t.to === filter)
                                             .sort((a, b) => new Date(a.date) - new Date(b.date));
                let runningBalance = 0;
                
                // Map the rows with running balance
                const rows = filtered.map(t => {
                    let inAmt = 0, outAmt = 0, particulars = '';
                    if (t.from === filter) {
                        outAmt = t.amount;
                        runningBalance -= t.amount;
                        particulars = `To: ${t.to}`;
                    } else {
                        inAmt = t.amount;
                        runningBalance += t.amount;
                        particulars = `From: ${t.from}`;
                    }
                    return `
                    <tr>
                        <td>${t.date}</td><td>${particulars}</td><td>${t.remarks}</td>
                        <td class="positive">${inAmt > 0 ? '₹'+inAmt.toLocaleString('en-IN') : '-'}</td>
                        <td class="negative">${outAmt > 0 ? '₹'+outAmt.toLocaleString('en-IN') : '-'}</td>
                        <td><strong>₹${runningBalance.toLocaleString('en-IN')}</strong></td>
                        <td>
                            <button class="action-btn btn-edit" onclick="editTransaction(${t.id})">Edit</button>
                            <button class="action-btn btn-delete" onclick="deleteTransaction(${t.id})">Del</button>
                        </td>
                    </tr>`;
                });
                
                // Reverse so the newest transaction (and current balance) is at the top
                html = rows.reverse().join('');
            }
            tbody.innerHTML = html;
        }

        // --- Transaction Management ---
        document.getElementById('txnForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const date = document.getElementById('txnDate').value;
            const from = document.getElementById('txnFrom').value;
            const to = document.getElementById('txnTo').value;
            const amount = parseFloat(document.getElementById('txnAmount').value);
            const remarks = document.getElementById('txnRemarks').value;

            if (from === to) { alert("Sender and Receiver cannot be the same."); return; }

            transactions.push({ id: Date.now(), date, from, to, amount, remarks });
            await saveData();
            updateUI();
            
            document.getElementById('txnAmount').value = '';
            document.getElementById('txnRemarks').value = '';
        });

        window.editTransaction = async function(id) {
            const txn = transactions.find(t => t.id === id);
            if (!txn) return;

            const newDate = prompt("Edit Date (YYYY-MM-DD):", txn.date);
            if (newDate === null) return; 

            const newAmountStr = prompt("Edit Amount (₹):", txn.amount);
            if (newAmountStr === null) return; 
            const newAmount = parseFloat(newAmountStr);

            const newRemarks = prompt("Edit Remarks:", txn.remarks);
            if (newRemarks === null) return;

            if (isNaN(newAmount) || newAmount <= 0) {
                alert("Invalid amount. Edit cancelled.");
                return;
            }

            txn.date = newDate;
            txn.amount = newAmount;
            txn.remarks = newRemarks;

            await saveData();
            updateUI();
        };

        window.deleteTransaction = async function(id) {
            if (confirm("Are you sure you want to completely delete this transaction? This will permanently alter the net balances.")) {
                transactions = transactions.filter(t => t.id !== id);
                await saveData();
                updateUI();
            }
        };

        // --- Member Management ---
        document.getElementById('memberForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newName = document.getElementById('newMemberName').value.trim();
            if (newName && !members.includes(newName)) {
                members.push(newName);
                await saveData();
                updateUI();
                document.getElementById('newMemberName').value = '';
            }
        });

        window.editMember = async function(oldName) {
            const newName = prompt(`Enter new name for "${oldName}":`, oldName);
            if (!newName || newName.trim() === "" || newName === oldName) return;
            const trimmed = newName.trim();
            if (members.includes(trimmed)) return alert("Name exists.");

            members[members.indexOf(oldName)] = trimmed;
            transactions.forEach(t => {
                if (t.from === oldName) t.from = trimmed;
                if (t.to === oldName) t.to = trimmed;
            });
            await saveData();
            updateUI();
        };

        window.deleteMember = async function(name) {
            if (transactions.some(t => t.from === name || t.to === name)) {
                return alert("Cannot delete. Clear all transactions for this entity first.");
            }
            if (confirm(`Remove "${name}" permanently?`)) {
                members = members.filter(m => m !== name);
                await saveData();
                updateUI();
            }
        };

        // --- PDF Generation ---
        window.generatePDF = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const entity = document.getElementById('statementSelect').value;
            
            const entityTxns = [...transactions]
                .filter(t => t.from === entity || t.to === entity)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            doc.setFontSize(18);
            doc.text(`Account Statement: ${entity}`, 14, 20);
            doc.setFontSize(11);
            doc.text(`Generated on: ${new Date().toLocaleDateString('en-IN')}`, 14, 28);

            let runBal = 0;
            const tableData = entityTxns.map(t => {
                let d=0, c=0, type="";
                if (t.from === entity) { d = t.amount; runBal -= t.amount; type = `To ${t.to}`; } 
                else { c = t.amount; runBal += t.amount; type = `From ${t.from}`; }
                return [ t.date, type, t.remarks, d>0 ? d.toFixed(2) : "-", c>0 ? c.toFixed(2) : "-", runBal.toFixed(2) ];
            });

            doc.autoTable({
                startY: 35,
                head: [['Date', 'Particulars', 'Remarks', 'Debit (Out)', 'Credit (In)', 'Balance']],
                body: tableData,
                theme: 'striped',
                headStyles: { fillColor: [44, 62, 80] }
            });
            doc.save(`${entity}_Statement_${new Date().getTime()}.pdf`);
        }

        init();
    </script>
</body>
</html>
