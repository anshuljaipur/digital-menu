<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter List Manager - Sunita Mavar</title>
    
    <!-- Libraries for CSV parsing, PDF and Image generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --primary: #0056b3;
            --primary-dark: #003d82;
            --bg: #f8f9fa;
            --text: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            position: relative;
            min-height: 100vh;
        }

        /* Congress Symbol Watermark */
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/Indian_National_Congress_hand_logo.svg/1024px-Indian_National_Congress_hand_logo.svg.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.08; 
            z-index: -1;
            pointer-events: none;
        }

        /* Top Header Bar */
        .top-header {
            background-color: var(--primary);
            color: white;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-logo {
            width: 50px;
            height: 50px;
            background-color: white;
            border-radius: 50%;
            padding: 4px;
            object-fit: contain;
            margin-right: 15px;
        }

        .header-info h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-info #datetimeDisplay {
            font-size: 12px;
            margin-top: 3px;
            opacity: 0.9;
        }

        .main-content {
            padding: 15px;
        }

        .header-controls {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            margin: 5px 0 15px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        /* Radio Buttons */
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            background: #f1f1f1;
            padding: 10px;
            border-radius: 5px;
        }
        
        .radio-group label {
            display: flex;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
            margin-right: 5px;
        }

        .radio-group input[type="radio"] {
            margin-right: 5px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .stats {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .btn-pdf { background-color: #e74c3c; }
        .btn-wa { background-color: #25D366; }

        /* Container to be exported */
        #export-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .card {
            border-bottom: 1px solid #ddd;
            padding: 12px 5px;
        }
        .card:last-child {
            border-bottom: none;
        }
        .card-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 6px;
            color: var(--primary);
        }
        .card-title span {
            color: #555;
            font-weight: normal;
            font-size: 14px;
        }
        .card-details {
            font-size: 14px;
            color: #444;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-weight: bold;
            color: #666;
        }
    </style>
</head>
<body>

    <!-- Header Title Bar -->
    <div class="top-header" id="export-header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/Indian_National_Congress_hand_logo.svg/1024px-Indian_National_Congress_hand_logo.svg.png" alt="INC Symbol" class="header-logo">
        <div class="header-info">
            <h1>SUNITA MAVAR</h1>
            <div id="datetimeDisplay">Loading Date & Time...</div>
        </div>
    </div>

    <div class="main-content">
        <div class="header-controls">
            
            <label><strong>Search In:</strong></label>
            <div class="radio-group">
                <label><input type="radio" name="searchScope" value="All" checked onchange="applyFilters()"> All</label>
                <label><input type="radio" name="searchScope" value="House Number" onchange="applyFilters()"> House No</label>
                <label><input type="radio" name="searchScope" value="Name" onchange="applyFilters()"> Name</label>
                <label><input type="radio" name="searchScope" value="VoterID Number" onchange="applyFilters()"> VIN</label>
            </div>

            <input type="text" id="searchInput" placeholder="Type to search..." onkeyup="applyFilters()" autofocus>
            
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Sex:</label>
                    <select id="sexFilter" onchange="applyFilters()">
                        <option value="All">All</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label>Status:</label>
                    <select id="statusFilter" onchange="applyFilters()">
                        <option value="All">All</option>
                    </select>
                </div>
            </div>

            <div class="stats" id="countDisplay">Total Shown: 0</div>

            <div class="button-group">
                <button class="btn-pdf" onclick="exportToPDF()">Export PDF</button>
                <button class="btn-wa" onclick="shareToWhatsApp()">Share WhatsApp</button>
            </div>
        </div>

        <!-- This section will be converted to PDF/Image -->
        <div id="export-container">
            <div id="resultsList">
                <div class="loading">Loading data from Google Sheets...</div>
            </div>
        </div>
    </div>

    <script>
        // Live Date & Time Updater
        function updateDateTime() {
            const now = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('datetimeDisplay').innerText = now.toLocaleDateString('en-IN', options);
        }
        setInterval(updateDateTime, 1000);
        updateDateTime(); // run instantly on load

        // Auto-focus search bar on load
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('searchInput').focus();
            }, 500);
        };

        // Your provided CSV URL
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHKf8MEj6EatuPnVn_UC-J7HrH3pn4vFLW9swh4UDWQjNphYUC9OmSjXGiENIiTjSrhNtMV5UcaYwF/pub?output=csv"; 

        let sheetData = [];
        let filteredData = [];

        // Fetch and parse the CSV on page load
        Papa.parse(csvUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                sheetData = results.data;
                
                populateDropdown('sexFilter', 'Sex');
                populateDropdown('statusFilter', 'Status');
                
                filteredData = [...sheetData];
                renderData(filteredData);
            },
            error: function(error) {
                document.getElementById('resultsList').innerHTML = 
                    `<p style="color:red; text-align:center;">Failed to load data. Please check connection.</p>`;
                console.error("Error parsing CSV:", error);
            }
        });

        function populateDropdown(selectId, columnName) {
            const select = document.getElementById(selectId);
            const uniqueValues = [...new Set(sheetData.map(item => item[columnName]))].filter(val => val && val.trim() !== "");
            uniqueValues.forEach(val => {
                const opt = document.createElement('option');
                opt.value = val;
                opt.innerText = val;
                select.appendChild(opt);
            });
        }

        function renderData(data) {
            const container = document.getElementById('resultsList');
            container.innerHTML = '';
            
            if(data.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888;">No results found.</p>';
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-title">
                        ${item['Name'] || 'N/A'} <span>(${item['Sex'] || '-'}, Age: ${item['Age'] || '-'})</span>
                    </div>
                    <div class="card-details">
                        <span>Voter ID: <strong>${item['VoterID Number'] || 'N/A'}</strong></span>
                        <span>Status: <strong>${item['Status'] || '-'}</strong></span>
                    </div>
                    <div class="card-details" style="font-size: 13px; color: #666;">
                        <span>Relative: ${item['Relative Name'] || '-'}</span>
                        <span>House No: <strong>${item['House Number'] || '-'}</strong></span>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('countDisplay').innerText = `Total Shown: ${data.length}`;
        }

        function applyFilters() {
            const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
            const searchScope = document.querySelector('input[name="searchScope"]:checked').value;
            const sex = document.getElementById('sexFilter').value;
            const status = document.getElementById('statusFilter').value;

            filteredData = sheetData.filter(item => {
                let matchesSearch = false;
                
                // Determine search area based on radio button
                if (searchText === "") {
                    matchesSearch = true;
                } else if (searchScope === "All") {
                    matchesSearch = Object.values(item).some(val => 
                        String(val || "").toLowerCase().includes(searchText)
                    );
                } else {
                    matchesSearch = String(item[searchScope] || "").toLowerCase().includes(searchText);
                }
                
                const matchesSex = sex === "All" || item['Sex'] === sex;
                const matchesStatus = status === "All" || item['Status'] === status;
                
                return matchesSearch && matchesSex && matchesStatus;
            });

            renderData(filteredData);
        }

        // Export Functions
        function exportToPDF() {
            const element = document.getElementById('export-container');
            const opt = {
                margin:       10,
                filename:     'SUNITA_MAVAR_voter_list.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        async function shareToWhatsApp() {
            const element = document.getElementById('export-container');
            
            try {
                const originalBg = element.style.background;
                element.style.background = '#ffffff';
                
                const canvas = await html2canvas(element, { scale: 2 });
                element.style.background = originalBg;

                canvas.toBlob(async (blob) => {
                    const file = new File([blob], "voters.png", { type: "image/png" });
                    
                    if (navigator.share) {
                        try {
                            await navigator.share({
                                title: 'Sunita Mavar - Voter List',
                                text: `Filtered List Count: ${filteredData.length}`,
                                files: [file]
                            });
                        } catch (err) {
                            console.error("Share failed:", err);
                        }
                    } else {
                        alert("Web Share API is not supported on this browser. Use a modern mobile browser over HTTPS.");
                    }
                });
            } catch (error) {
                console.error("Error generating image:", error);
                alert("Failed to generate image.");
            }
        }
    </script>
</body>
</html>
