<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter List Manager - SUNITA MAVAR</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --primary: #0056b3; --primary-dark: #003d82; --bg: #f8f9fa; --text: #333; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; position: relative; min-height: 100vh; }
        
        body::before { content: ""; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 80%; background-image: url('inc.webp'); background-size: contain; background-repeat: no-repeat; background-position: center; opacity: 0.08; z-index: -1; pointer-events: none; }

        .top-header { background-color: var(--primary); color: white; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 10; box-sizing: border-box; min-height: 68px; }
        .header-logo { width: 48px; height: 48px; background-color: white; border-radius: 50%; padding: 3px; object-fit: contain; flex-shrink: 0; }
        .header-spacer { width: 48px; flex-shrink: 0; }
        .header-info { flex-grow: 1; text-align: center; padding: 0 10px; }
        .header-info h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; line-height: 1.2; }
        .header-info #datetimeDisplay { font-size: 11px; margin-top: 4px; opacity: 0.9; letter-spacing: 0.3px; }

        .main-content { padding: 15px; }
        .header-controls { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input[type="text"], select { width: 100%; padding: 12px; margin: 5px 0 15px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px; }

        .radio-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; background: #f1f1f1; padding: 10px; border-radius: 5px; }
        .radio-group label { display: flex; align-items: center; font-size: 14px; cursor: pointer; margin-right: 5px; }
        .radio-group input[type="radio"] { margin-right: 5px; width: 18px; height: 18px; accent-color: var(--primary); }

        .stats { font-weight: bold; color: var(--primary); margin-bottom: 15px; font-size: 1.1em; text-align: center;}
        .button-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 5px; font-size: 14px; font-weight: bold; color: white; cursor: pointer; }
        .btn-pdf { background-color: #e74c3c; } .btn-wa { background-color: #25D366; }

        #export-container { background: rgba(255, 255, 255, 0.95); border-radius: 10px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card { border-bottom: 1px solid #ddd; padding: 12px 5px; }
        .card:last-child { border-bottom: none; }
        .card-title { font-weight: bold; font-size: 16px; margin-bottom: 6px; color: var(--primary); }
        .card-title span { color: #555; font-weight: normal; font-size: 14px; }
        .card-details { font-size: 14px; color: #444; display: flex; justify-content: space-between; margin-bottom: 4px; }
        .loading { text-align: center; padding: 20px; font-weight: bold; color: #666; }
        
        .btn-load-more { background-color: #6c757d; width: 100%; margin-top: 15px; padding: 15px; font-size: 16px; display: none; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-header" id="export-header">
        <img src="inc.webp" alt="INC Symbol" class="header-logo">
        <div class="header-info">
            <h1>SUNITA MAVAR</h1>
            <div id="datetimeDisplay">Loading Date & Time...</div>
        </div>
        <div class="header-spacer"></div>
    </div>

    <div class="main-content">
        <div class="header-controls">
            <label><strong>Search In:</strong></label>
            <div class="radio-group">
                <label><input type="radio" name="searchScope" value="All" checked onchange="applyFilters()"> All</label>
                <label><input type="radio" name="searchScope" value="House Number" onchange="applyFilters()"> House No</label>
                <label><input type="radio" name="searchScope" value="Name" onchange="applyFilters()"> Name</label>
                <label><input type="radio" name="searchScope" value="VoterID Number" onchange="applyFilters()"> VIN</label>
            </div>

            <input type="text" id="searchInput" placeholder="Type to search..." onkeyup="applyFilters()" autofocus>
            
            <div style="margin-bottom: 10px;">
                <label>Filter by Sex:</label>
                <select id="sexFilter" onchange="applyFilters()"><option value="All">All</option></select>
            </div>

            <div class="stats" id="countDisplay">Total Found: 0</div>

            <div class="button-group">
                <button class="btn-pdf" onclick="exportToPDF()">Export PDF</button>
                <button class="btn-wa" onclick="shareToWhatsApp()">Share WhatsApp</button>
            </div>
        </div>

        <div id="export-container">
            <div id="resultsList">
                <div class="loading">Loading 20,000 voters from Google Sheets...</div>
            </div>
            <button id="loadMoreBtn" class="btn-load-more" onclick="loadMore()">Load Next 100</button>
        </div>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('datetimeDisplay').innerText = now.toLocaleDateString('en-IN', options);
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        window.onload = () => { setTimeout(() => { document.getElementById('searchInput').focus(); }, 500); };

        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSHKf8MEj6EatuPnVn_UC-J7HrH3pn4vFLW9swh4UDWQjNphYUC9OmSjXGiENIiTjSrhNtMV5UcaYwF/pub?output=csv"; 

        let sheetData = [];
        let filteredData = [];
        let itemsPerPage = 100;
        let currentPage = 1;

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                sheetData = results.data;
                populateDropdown('sexFilter', 'Sex');
                filteredData = [...sheetData];
                renderData(true);
            },
            error: function(error) {
                document.getElementById('resultsList').innerHTML = `<p style="color:red; text-align:center;">Failed to load data.</p>`;
            }
        });

        function populateDropdown(selectId, columnName) {
            const select = document.getElementById(selectId);
            const uniqueValues = [...new Set(sheetData.map(item => item[columnName]))].filter(val => val && val.trim() !== "");
            uniqueValues.forEach(val => {
                const opt = document.createElement('option');
                opt.value = val;
                opt.innerText = val;
                select.appendChild(opt);
            });
        }

        function renderData(reset = false) {
            const container = document.getElementById('resultsList');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            
            if(reset) {
                container.innerHTML = '';
                currentPage = 1;
            }
            
            if(filteredData.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888;">No results found.</p>';
                loadMoreBtn.style.display = 'none';
                document.getElementById('countDisplay').innerText = `Total Found: 0`;
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const dataToShow = filteredData.slice(startIndex, endIndex);

            dataToShow.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-title">${item['Name'] || 'N/A'} <span>(${item['Sex'] || '-'}, Age: ${item['Age'] || '-'})</span></div>
                    <div class="card-details">
                        <span>Voter ID: <strong>${item['VoterID Number'] || 'N/A'}</strong></span>
                    </div>
                    <div class="card-details" style="font-size: 13px; color: #666;">
                        <span>Relative: ${item['Relative Name'] || '-'}</span>
                        <span>House No: <strong>${item['House Number'] || '-'}</strong></span>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('countDisplay').innerText = `Total Found: ${filteredData.length} (Showing ${Math.min(endIndex, filteredData.length)})`;
            loadMoreBtn.style.display = (endIndex < filteredData.length) ? 'block' : 'none';
        }

        function loadMore() {
            currentPage++;
            renderData(false);
        }

        function normalizeHindiToNumeric(str) {
            if (!str) return "";
            const hindiToNumericMap = {
                '०': '0', '१': '1', '२': '2', '३': '3', '४': '4',
                '५': '5', '६': '6', '७': '7', '८': '8', '९': '9'
            };
            return String(str).replace(/[०-९]/g, match => hindiToNumericMap[match]);
        }

        function applyFilters() {
            const rawSearchText = document.getElementById('searchInput').value.toLowerCase().trim();
            const searchText = normalizeHindiToNumeric(rawSearchText);
            
            const searchScope = document.querySelector('input[name="searchScope"]:checked').value;
            const sex = document.getElementById('sexFilter').value;

            filteredData = sheetData.filter(item => {
                let matchesSearch = false;
                
                if (searchText === "") { 
                    matchesSearch = true; 
                } 
                else if (searchScope === "All") {
                    // Search all columns EXCEPT 'S.No.'
                    matchesSearch = Object.entries(item).some(([key, val]) => {
                        if (key === 'S.No.') return false; // Ignore Serial Number column entirely
                        
                        const normalizedVal = normalizeHindiToNumeric(String(val || "").toLowerCase());
                        return normalizedVal.includes(searchText);
                    });
                } else {
                    const normalizedVal = normalizeHindiToNumeric(String(item[searchScope] || "").toLowerCase());
                    matchesSearch = normalizedVal.includes(searchText);
                }
                
                const matchesSex = sex === "All" || item['Sex'] === sex;
                
                return matchesSearch && matchesSex;
            });

            renderData(true);
        }

        function exportToPDF() {
            const element = document.getElementById('export-container');
            const opt = { margin: 10, filename: 'SUNITA_MAVAR_voter_list.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
            html2pdf().set(opt).from(element).save();
        }

        async function shareToWhatsApp() {
            const element = document.getElementById('export-container');
            try {
                const originalBg = element.style.background;
                element.style.background = '#ffffff';
                const canvas = await html2canvas(element, { scale: 2 });
                element.style.background = originalBg;
                canvas.toBlob(async (blob) => {
                    const file = new File([blob], "voters.png", { type: "image/png" });
                    if (navigator.share) {
                        try { await navigator.share({ title: 'Sunita Mavar - Voter List', text: `Found: ${filteredData.length} voters`, files: [file] }); } 
                        catch (err) { console.error("Share failed:", err); }
                    } else { alert("Web Share API is not supported. Use a modern mobile browser over HTTPS."); }
                });
            } catch (error) { alert("Failed to generate image."); }
        }
    </script>
</body>
</html>
