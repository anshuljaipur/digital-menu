<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Catalyst – Print your file</title>
<link rel="stylesheet" href="style.css">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<main>
  <h1>Print your file</h1>
  <section class="panel">
    <label>File (PDF or photo)
      <input type="file" id="file" accept="application/pdf,image/*">
    </label>
    <label>Copies
      <input type="number" id="copies" min="1" max="99" value="1">
    </label>
    <label>Color
      <select id="color"><option value="color">Color</option><option value="bw">Black &amp; white</option></select>
    </label>
    <label class="row"><input type="checkbox" id="duplex"> Print on both sides</label>
    <button id="quote" class="primary">See price</button>
    <p id="price" class="status" role="status"></p>
    <button id="pay" class="primary" hidden>Pay</button>
    <p id="msg" class="status" role="status"></p>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { firebaseConfig } from "./config.js";

const db = getDatabase(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
const NOCONN = "Could not reach the server. Please try again.";
const STATUS = {
  paid: "Payment received. Preparing to print…",
  printing: "Printing…",
  printed: "Printed. Please collect it from the shop."
};
let id = null, quote = null, timer = null;

const withTimeout = (p, ms, t) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(t)), ms))]);
function msg(t, cls) { const m = $("msg"); m.textContent = t; m.className = "status " + (cls || ""); }

function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 3508 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL("image/jpeg", 0.88).split(",")[1]);
    };
    img.onerror = () => rej(new Error("Could not read this image."));
    img.src = URL.createObjectURL(file);
  });
}
function toBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = () => rej(new Error("Could not read this file."));
    r.readAsDataURL(file);
  });
}

$("quote").onclick = async () => {
  const file = $("file").files[0];
  if (!file) return msg("Choose a file first.", "bad");
  const btn = $("quote"); btn.disabled = true; msg("Uploading…");
  try {
    const isPdf = file.type === "application/pdf";
    const data = isPdf ? await toBase64(file) : await shrink(file);
    if (data.length > 11500000) throw new Error("File is too large (limit about 8 MB).");
    id = push(ref(db, "orders")).key;
    await withTimeout(set(ref(db, "files/" + id), { data }), 25000, NOCONN);
    await withTimeout(set(ref(db, `orders/${id}/job`), {
      name: file.name, kind: isPdf ? "pdf" : "image",
      copies: Math.min(99, Math.max(1, parseInt($("copies").value, 10) || 1)),
      color: $("color").value, duplex: $("duplex").checked, created: Date.now()
    }), 25000, NOCONN);
    msg("Calculating price…");
    timer = setTimeout(() => msg("The print shop is not responding. Please try again later.", "bad"), 45000);
    watch();
  } catch (e) { msg(e.message, "bad"); btn.disabled = false; }
};

function watch() {
  onValue(ref(db, `orders/${id}/quote`), s => {
    if (!s.exists()) return;
    clearTimeout(timer); quote = s.val();
    const rs = "₹" + (quote.amount / 100).toFixed(2);
    $("price").textContent = `${quote.pages} page(s) × ${quote.copies} copies = ${rs}`;
    $("pay").textContent = "Pay " + rs; $("pay").hidden = false; msg("");
  });
  onValue(ref(db, `orders/${id}/status`), s => {
    const v = s.val(); if (!v || !STATUS[v]) return;
    $("pay").hidden = true; msg(STATUS[v], v === "printed" ? "ok" : "");
  });
  onValue(ref(db, `orders/${id}/error`), s => {
    if (s.exists()) { $("pay").hidden = true; msg(s.val(), "bad"); }
  });
}

$("pay").onclick = () => {
  const rz = new Razorpay({
    key: quote.keyId, amount: quote.amount, currency: "INR", order_id: quote.orderId,
    name: "Print Catalyst", description: "Print job",
    handler: r => {
      $("pay").hidden = true; msg("Confirming payment…");
      set(ref(db, `orders/${id}/payment`), { payment_id: r.razorpay_payment_id, signature: r.razorpay_signature });
    }
  });
  rz.open();
};
</script>
</body>
</html>
