<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send to printer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Send to printer</h1>
  <section class="panel">
    <p id="conn" class="status" role="status">Connecting to Firebase…</p>
    <label>Shop code
      <input type="password" id="code" autocomplete="off" placeholder="Same code as the print station">
    </label>
    <label>File (PDF or photo)
      <input type="file" id="file" accept="application/pdf,image/*">
    </label>
    <label>Copies
      <input type="number" id="copies" min="1" max="999" value="1">
    </label>
    <label>Colour
      <select id="color"><option value="color">Colour</option><option value="bw">Black &amp; white</option></select>
    </label>
    <label>Orientation
      <select id="orient"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select>
    </label>
    <label class="row"><input type="checkbox" id="fit" checked> Fit to page</label>
    <label class="row"><input type="checkbox" id="duplex"> Print on both sides</label>
    <button id="send" class="primary">Send to printer</button>
    <p id="msg" class="status" role="status"></p>
  </section>
  <section class="panel">
    <strong>This session</strong>
    <ul id="log"><li><small>Nothing sent yet.</small></li></ul>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { firebaseConfig } from "./config.js";

const db = getDatabase(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
const LABEL = { queued: "Waiting for printer", printing: "Printing…", done: "Printed", error: "Failed" };

const withTimeout = (p, ms, text) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(text)), ms))]);
const NOCONN = "Could not reach Firebase. Check databaseURL in config.js, that the database exists, and that the rules are published.";
onValue(ref(db, ".info/connected"), snap => {
  const c = $("conn");
  c.textContent = snap.val() ? "Connected to Firebase" : "Not connected to Firebase…";
  c.className = "status " + (snap.val() ? "ok" : "bad");
});

try { $("code").value = localStorage.getItem("pc_code") || ""; } catch (e) {}

function msg(t, bad) { const m = $("msg"); m.textContent = t; m.className = "status " + (bad ? "bad" : "ok"); }

function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 3508 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const x = c.getContext("2d");
      x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL("image/jpeg", 0.88).split(",")[1]);
    };
    img.onerror = () => rej(new Error("Could not read this image."));
    img.src = URL.createObjectURL(file);
  });
}

function toBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = () => rej(new Error("Could not read this file."));
    r.readAsDataURL(file);
  });
}

$("send").onclick = async () => {
  const code = $("code").value.trim();
  const file = $("file").files[0];
  if (code.length < 12) return msg("Shop code must be at least 12 characters.", true);
  if (!file) return msg("Choose a file first.", true);
  const btn = $("send"); btn.disabled = true; msg("Uploading…");
  try {
    try { localStorage.setItem("pc_code", code); } catch (e) {}
    const isPdf = file.type === "application/pdf";
    const data = isPdf ? await toBase64(file) : await shrink(file);
    if (data.length > 11500000) throw new Error("File is too large (limit about 8 MB).");
    const id = push(ref(db, `queues/${code}/jobs`)).key;
    await withTimeout(set(ref(db, `queues/${code}/files/${id}`), { data }), 25000, NOCONN);
    await withTimeout(set(ref(db, `queues/${code}/jobs/${id}`), {
      name: file.name, kind: isPdf ? "pdf" : "image",
      copies: Math.max(1, parseInt($("copies").value, 10) || 1),
      orient: $("orient").value, fit: $("fit").checked, duplex: $("duplex").checked,
      color: $("color").value, status: "queued", created: Date.now()
    }), 25000, NOCONN);
    msg("Sent. Keep this page open to see progress.");
    track(code, id, file.name);
    $("file").value = "";
  } catch (e) {
    msg(e.message || "Upload failed.", true);
  }
  btn.disabled = false;
};

function track(code, id, name) {
  const log = $("log");
  if (log.firstElementChild && log.firstElementChild.querySelector("small")) log.innerHTML = "";
  const li = document.createElement("li");
  li.innerHTML = "<span></span><strong></strong>";
  li.firstChild.textContent = name;
  log.prepend(li);
  onValue(ref(db, `queues/${code}/jobs/${id}`), snap => {
    const j = snap.val(); if (!j) return;
    const s = li.querySelector("strong");
    s.textContent = LABEL[j.status] || j.status;
    s.className = j.status === "done" ? "ok" : j.status === "error" ? "bad" : "";
    if (j.status === "error" && j.error) li.title = j.error;
  });
}
</script>
</body>
</html>
