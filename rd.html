<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16302A">
<title>RD Register — Master & Ledger Management</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F1EEE2; --paper-2:#E8E4D3; --ink:#16302A; --ink-soft:#3E5850;
    --rule:#C9C2A6; --rule-strong:#16302A; --brass:#9C6B22; --brass-2:#B98A3B;
    --danger:#8C3A2B; --danger-soft:#F3DCD5; --ok:#2F6B4F; --radius:3px;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans', sans-serif; font-size:14px; min-height:100vh; padding-bottom:40px; -webkit-text-size-adjust:100%;}
  .nums{font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;}
  
  .band{background:var(--ink); color:var(--paper); padding:16px 20px;}
  .band-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .brand h1{font-family:'Fraunces', serif; font-size:20px; margin:0;}
  .conn-status{font-size:12px; display:flex; align-items:center; gap:6px; color:#C9CFC9;}
  .dot{width:7px; height:7px; border-radius:50%; background:#7A8C86;} .dot.on{background:#7FC79A;}
  
  .wrap{max-width:1180px; margin:0 auto; padding:20px;}
  .panel{background:var(--paper-2); border:1px solid var(--rule); border-radius:var(--radius); padding:16px; margin-bottom:18px;}
  
  .grid{display:grid; gap:10px;} .cols-2{grid-template-columns:repeat(2,1fr);}
  label{display:block; font-size:11px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:4px;}
  input, select{width:100%; padding:10px; border:1px solid var(--rule); background:#FBFAF4; border-radius:2px; font-family:inherit; font-size:16px;}
  input:focus, select:focus{outline:2px solid var(--brass-2); border-color:var(--brass-2);}
  
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 14px; border-radius:2px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); font-size:14px; font-weight:500; cursor:pointer; white-space:nowrap;}
  .btn:hover{background:#0F241F;} .btn.secondary{background:transparent; color:var(--ink); border-color:var(--rule-strong);} .btn.secondary:hover{background:#e4dfc9;}
  .btn.brass{background:var(--brass); border-color:var(--brass); color:#fff;} .btn.brass:hover{background:#845A1B;}
  .btn.danger{background:transparent; color:var(--danger); border-color:var(--danger);} .btn:disabled{opacity:0.45; cursor:not-allowed;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap;} .btn-sm{padding:6px 10px; font-size:12px;}
  .status-line{font-size:12.5px; margin-top:10px; color:var(--ink-soft);} .status-line.ok{color:var(--ok);}
  
  .table-wrap{background:#FBFAF4; border:1px solid var(--rule); border-radius:var(--radius); overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{width:100%; border-collapse:collapse; min-width:700px;}
  thead th{text-align:left; font-size:11px; text-transform:uppercase; color:var(--ink-soft); padding:12px; border-bottom:2px solid var(--rule-strong); background:var(--paper-2); cursor:pointer; user-select:none; white-space:nowrap;}
  thead th:active{background:var(--rule);}
  tbody td{padding:10px 12px; border-bottom:1px solid var(--rule); white-space:nowrap;}
  tbody tr:hover{background:#F3EEDD;} .num-cell{text-align:right;}
  .badge{display:inline-block; padding:2px 8px; border:1px solid var(--brass); color:var(--brass); border-radius:20px; font-size:11.5px;}
  
  .name-link{color:var(--brass-2); font-weight:600; text-decoration:underline; cursor:pointer;}
  .name-link:active{color:var(--ink);}

  .overlay{position:fixed; inset:0; background:rgba(22,48,42,0.7); display:none; align-items:flex-end; justify-content:center; z-index:50;}
  .overlay.show{display:flex;}
  .overlay.center{align-items:center;}
  .modal{background:var(--paper); border-radius:12px 12px 0 0; width:100%; max-width:800px; padding:20px; max-height:90vh; overflow-y:auto;}
  .overlay.center .modal{border-radius:12px; max-width:400px;}
  .modal h3{font-family:'Fraunces',serif; font-size:18px; margin:0 0 16px;}
  
  .ledger-box{background:#FBFAF4; border:1px solid var(--rule); padding:12px; margin-bottom:14px; border-radius:var(--radius);}
  .ledger-table th, .ledger-table td{font-size:13px; padding:8px;}
  .ledger-form{display:flex; flex-direction:column; gap:10px; background:var(--paper-2); padding:12px; border-radius:var(--radius);}
  .sort-arrow{font-size:10px; margin-left:4px; opacity:0.6;}

  @media (max-width: 600px){
    .wrap { padding: 0; }
    .panel { border: none; border-radius: 0; padding: 12px; margin-bottom: 10px; border-bottom: 1px solid var(--rule); }
    .table-wrap { border-left: none; border-right: none; border-radius: 0; }
    .btn { flex: 1; justify-content: center; } 
    .btn-row.actions { flex-wrap: nowrap; }
  }
</style>
</head>
<body>

<div class="band">
  <div class="band-inner">
    <div class="brand"><h1>RD Register</h1></div>
    <div class="conn-status"><span class="dot off" id="connDot"></span><span id="connText">Locked</span></div>
  </div>
</div>

<!-- LOCK SCREEN MODAL -->
<div class="overlay center show" id="overlayLock">
  <div class="modal" style="text-align:center;">
    <h3 style="font-size:22px; color:var(--ink);">App Locked</h3>
    <p style="color:var(--ink-soft); font-size:13px; margin-bottom:20px;">Enter your PIN to access the ledger.</p>
    <form id="authForm" style="display:flex; flex-direction:column; gap:14px;">
      <input type="password" id="appPin" placeholder="Enter PIN" required style="text-align:center; letter-spacing:4px; font-size:20px; padding:14px;">
      <button type="submit" class="btn brass" id="btnUnlock" style="padding:14px; font-size:16px;">Unlock & Sync</button>
      <div id="authStatus" class="status-line err" style="margin-top:0;"></div>
    </form>
  </div>
</div>

<div class="wrap" id="appArea" style="display:none;">
  <div class="panel">
    <div class="btn-row" style="margin-bottom:12px;">
      <button class="btn brass" id="btnAddClient">+ New</button>
      <button class="btn" id="btnSaveSheet" disabled>Sync Cloud</button>
      <button class="btn secondary" id="btnDownloadXlsx">↓ All</button>
    </div>
    <div class="status-line" id="saveStatusLine"></div>

    <div style="margin-top:14px;">
      <input type="search" id="fSearchMaster" list="clientNamesData" placeholder="🔍 Search name or A/C..." style="border:1px solid var(--rule-strong); font-weight:500;">
      <datalist id="clientNamesData"></datalist>
    </div>

    <div class="table-wrap" style="margin-top:14px;">
      <table id="clientsTable">
        <thead>
          <tr>
            <th data-key="accountNo">A/C No.<span class="sort-arrow"></span></th>
            <th data-key="holderName">Name (Tap to open)<span class="sort-arrow"></span></th>
            <th data-key="amount">Installment<span class="sort-arrow"></span></th>
            <th data-key="totalDeposit">Total Dep.<span class="sort-arrow"></span></th>
            <th data-key="nextDueDate">Next Due<span class="sort-arrow"></span></th>
            <th>Edit</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- CLIENT DETAILS MODAL -->
<div class="overlay" id="overlayClient">
  <div class="modal">
    <h3 id="modalTitle">Client Profile</h3>
    <form id="clientForm">
      <input type="hidden" id="fEditingId">
      <div class="grid cols-2">
        <div><label>A/C No. *</label><input type="text" id="fAccountNo" required></div>
        <div><label>Short Code</label><input type="text" id="fShortCodeInput"></div>
        <div style="grid-column: span 2;"><label>Name *</label><input type="text" id="fHolderName" required></div>
        <div><label>Installment *</label><input type="number" step="0.01" id="fAmount" required></div>
        <div><label>Opened On</label><input type="date" id="fOpenedOn"></div>
        <div><label>Total Deposit</label><input type="number" step="0.01" id="fTotalDeposit" readonly></div>
        <div><label>Next Due Date</label><input type="date" id="fNextDueDate"></div>
      </div>
      <div class="btn-row" style="margin-top:20px;">
        <button type="submit" class="btn brass" style="flex:2;">Save Profile</button>
        <button type="button" class="btn secondary" style="flex:1;" onclick="el('overlayClient').classList.remove('show')">Cancel</button>
      </div>
      <button type="button" class="btn danger" style="width:100%; margin-top:10px;" id="btnDeleteProfile" style="display:none;">Delete Client</button>
    </form>
  </div>
</div>

<!-- LEDGER TRANSACTIONS MODAL -->
<div class="overlay" id="overlayLedger">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <h3 id="ledgerTitle" style="margin-bottom:10px;">Ledger Details</h3>
      <button class="btn secondary btn-sm" onclick="el('overlayLedger').classList.remove('show')">✕ Close</button>
    </div>
    
    <input type="hidden" id="activeLedgerAccount">
    
    <div class="grid cols-2 ledger-box">
      <div><label>Total Deposit</label><div class="nums" id="ledgerTotal" style="font-size:18px; font-weight:600;">₹0</div></div>
      <div><label>Next Due</label><div class="nums" id="ledgerDue" style="font-size:18px; font-weight:600;">—</div></div>
    </div>

    <div class="btn-row" style="margin-bottom:14px;">
      <button class="btn secondary btn-sm" onclick="forwardLedger()">📤 Share / Forward</button>
      <button class="btn secondary btn-sm" onclick="downloadLedger()">📥 Download Excel</button>
    </div>

    <form class="ledger-form" id="txnForm">
      <input type="hidden" id="tEditingId">
      <div class="grid cols-2">
        <div><label>Date</label><input type="date" id="tDate" required></div>
        <div><label>Amount</label><input type="number" step="0.01" id="tAmount" required></div>
      </div>
      <div><label>Remarks (Optional)</label><input type="text" id="tRemarks"></div>
      <div class="btn-row">
        <button type="submit" class="btn brass" id="tSubmitBtn" style="flex:2;">+ Add Payment</button>
        <button type="button" class="btn secondary" id="tCancelBtn" style="display:none; flex:1;" onclick="resetTxnForm()">Cancel</button>
      </div>
    </form>

    <div class="table-wrap" style="margin-top:14px; max-height:40vh;">
      <table class="ledger-table">
        <thead><tr><th>Date</th> <th>Amount</th> <th>Notes</th> <th>Actions</th></tr></thead>
        <tbody id="ledgerTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
/* ============================================================
   STATE & CONFIGURATION
   ============================================================ */
const sheetUrl = "https://script.google.com/macros/s/AKfycbzWRoN9uB3kmsQCmeB8P4OsouTlsX-6werl3Bq6V1jkCofKE7vK7lWn5TLlo46Nb0c/exec";

let activePin = localStorage.getItem('rd_app_pin') || '';
let clients = [];          
let transactions = {}; 
let dirty = false;
let sortKey = 'accountNo';
let sortDir = 1;

const el = id => document.getElementById(id);
const uid = () => 'id_' + Math.random().toString(36).substr(2, 9);
const toISODate = (v) => v ? new Date(v).toISOString().slice(0,10) : '';
const fmtMoney = (n) => '₹' + (Number(n)||0).toLocaleString('en-IN', {maximumFractionDigits:2});
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) : '—';
const escapeHtml = (s) => String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* ============================================================
   AUTHENTICATION & LOAD
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  if(activePin) {
    el('appPin').value = activePin;
    attemptLoad(activePin);
  }
});

el('authForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const entered = el('appPin').value.trim();
  attemptLoad(entered);
});

async function attemptLoad(pin) {
  el('btnUnlock').disabled = true;
  el('btnUnlock').textContent = 'Verifying...';
  el('authStatus').textContent = '';

  try {
    const res = await fetch(sheetUrl + "?pin=" + encodeURIComponent(pin));
    if (!res.ok) throw new Error("Network error.");
    const result = await res.json();
    
    if (result.error) {
      throw new Error(result.error);
    }

    // Success - save PIN and unlock app
    activePin = pin;
    localStorage.setItem('rd_app_pin', activePin);
    
    clients = (result.clients || []).map(r => ({
      id: uid(), accountNo: String(r['Account No.'] || '').trim(), amount: Number(r['Amount']) || 0,
      holderName: String(r['Account Holder Name'] || '').trim(), nextDueDate: toISODate(r['Next Due Date']),
      totalDeposit: Number(r['Total Deposit']) || 0, openedOn: toISODate(r['Opened On']),
      shortCode: String(r['Short Code'] || '').trim(),
    })).filter(c => c.accountNo !== '');

    transactions = {};
    Object.keys(result.transactions || {}).forEach(accNo => {
      transactions[accNo] = result.transactions[accNo].map(t => ({
        txnId: t['Txn ID'] || uid(), date: toISODate(t['Date']), amount: Number(t['Amount']) || 0, remarks: String(t['Remarks'] || '')
      }));
    });

    el('overlayLock').classList.remove('show');
    el('connDot').className = 'dot on';
    el('connText').textContent = 'Cloud Synced';
    el('btnSaveSheet').disabled = false;
    el('appArea').style.display = 'block';
    renderMasterTable();
  } catch(err) {
    el('authStatus').textContent = 'Access Denied: ' + err.message;
    localStorage.removeItem('rd_app_pin');
    activePin = '';
    el('appPin').value = '';
    el('btnUnlock').disabled = false;
    el('btnUnlock').textContent = 'Unlock & Sync';
  }
}

/* ============================================================
   MASTER TABLE LOGIC & SORTING & SEARCH
   ============================================================ */
function renderMasterTable(){
  const tbody = el('tableBody');
  el('clientNamesData').innerHTML = clients.map(c => `<option value="${escapeHtml(c.holderName)}"></option>`).join('');
  const query = el('fSearchMaster').value.trim().toLowerCase();
  let filtered = clients.filter(c => {
    if(!query) return true;
    return c.holderName.toLowerCase().includes(query) || c.accountNo.toLowerCase().includes(query);
  });

  if(filtered.length === 0){
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px;">No clients found matching "${escapeHtml(query)}".</td></tr>`;
    return;
  }

  let sortedList = [...filtered];
  sortedList.sort((a,b) => {
    let av = a[sortKey], bv = b[sortKey];
    if(typeof av === 'string') { av = av.toLowerCase(); bv = bv.toLowerCase(); }
    if(av < bv) return -1 * sortDir;
    if(av > bv) return 1 * sortDir;
    return 0;
  });

  tbody.innerHTML = sortedList.map(c => `
    <tr>
      <td class="nums">${escapeHtml(c.accountNo)}</td>
      <td class="name-link" onclick="openLedger('${c.accountNo}')">${escapeHtml(c.holderName)}</td>
      <td class="nums num-cell">${fmtMoney(c.amount)}</td>
      <td class="nums num-cell" style="font-weight:600; color:var(--ok);">${fmtMoney(c.totalDeposit)}</td>
      <td>${fmtDate(c.nextDueDate)}</td>
      <td><button class="btn secondary btn-sm" onclick="editClient('${c.id}')">Edit</button></td>
    </tr>`).join('');

  document.querySelectorAll('th[data-key]').forEach(th => {
    const arrow = th.querySelector('.sort-arrow');
    arrow.textContent = (th.dataset.key === sortKey) ? (sortDir === 1 ? ' ▲' : ' ▼') : '';
  });
}

el('fSearchMaster').addEventListener('input', renderMasterTable);
document.querySelectorAll('th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if(sortKey === key) sortDir *= -1;
    else { sortKey = key; sortDir = 1; }
    renderMasterTable();
  });
});

/* ============================================================
   CLIENT PROFILE ADD/EDIT/DELETE
   ============================================================ */
el('btnAddClient').addEventListener('click', () => {
  el('clientForm').reset(); el('fEditingId').value = ''; el('fTotalDeposit').value = 0;
  el('fOpenedOn').value = new Date().toISOString().slice(0,10); el('modalTitle').textContent = 'New Client';
  el('btnDeleteProfile').style.display = 'none'; el('overlayClient').classList.add('show');
});

window.editClient = (id) => {
  const c = clients.find(x => x.id === id); if(!c) return;
  el('fEditingId').value = c.id; el('fAccountNo').value = c.accountNo; el('fShortCodeInput').value = c.shortCode;
  el('fHolderName').value = c.holderName; el('fAmount').value = c.amount; el('fTotalDeposit').value = c.totalDeposit;
  el('fOpenedOn').value = c.openedOn; el('fNextDueDate').value = c.nextDueDate; el('modalTitle').textContent = `Edit Profile`;
  el('btnDeleteProfile').style.display = 'block'; el('btnDeleteProfile').onclick = () => deleteClient(c.id);
  el('overlayClient').classList.add('show');
};

el('clientForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const id = el('fEditingId').value; const accNo = el('fAccountNo').value.trim();
  if(clients.some(c => c.accountNo === accNo && c.id !== id)){ alert("Account Number exists!"); return; }

  const data = { accountNo: accNo, shortCode: el('fShortCodeInput').value.trim(), holderName: el('fHolderName').value.trim(),
    amount: Number(el('fAmount').value)||0, totalDeposit: Number(el('fTotalDeposit').value)||0, openedOn: el('fOpenedOn').value, nextDueDate: el('fNextDueDate').value };

  if(id){
    const idx = clients.findIndex(x => x.id === id); const oldAcc = clients[idx].accountNo;
    clients[idx] = {...clients[idx], ...data};
    if(oldAcc !== accNo) { transactions[accNo] = transactions[oldAcc] || []; delete transactions[oldAcc]; }
  } else { clients.push({id: uid(), ...data}); transactions[accNo] = []; }

  dirty = true; markUnsaved(); el('overlayClient').classList.remove('show'); renderMasterTable();
});

window.deleteClient = (id) => {
  const c = clients.find(x => x.id === id);
  if(!confirm(`Delete profile and entire ledger tab for ${c.accountNo}?`)) return;
  clients = clients.filter(x => x.id !== id); delete transactions[c.accountNo];
  dirty = true; markUnsaved(); el('overlayClient').classList.remove('show'); renderMasterTable();
};

/* ============================================================
   INDIVIDUAL LEDGER 
   ============================================================ */
window.openLedger = (accNo) => {
  const c = clients.find(x => x.accountNo === accNo);
  el('ledgerTitle').textContent = `${c.holderName} (${c.accountNo})`; el('activeLedgerAccount').value = accNo;
  resetTxnForm(); renderLedgerTable(accNo); el('overlayLedger').classList.add('show');
};

function renderLedgerTable(accNo) {
  const c = clients.find(x => x.accountNo === accNo);
  el('ledgerTotal').textContent = fmtMoney(c.totalDeposit); el('ledgerDue').textContent = fmtDate(c.nextDueDate);
  
  const txns = transactions[accNo] || []; const tbody = el('ledgerTableBody');
  if(txns.length === 0){ tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No records yet.</td></tr>`; return; }
  
  const sorted = [...txns].sort((a,b) => (a.date < b.date ? 1 : -1));
  tbody.innerHTML = sorted.map(t => `<tr><td>${fmtDate(t.date)}</td><td class="nums"><b>${fmtMoney(t.amount)}</b></td>
      <td>${escapeHtml(t.remarks)}</td><td><div class="btn-row actions">
      <button class="btn secondary btn-sm" onclick="editTxn('${accNo}', '${t.txnId}')">✎</button>
      <button class="btn danger btn-sm" onclick="deleteTxn('${accNo}', '${t.txnId}')">✕</button></div></td></tr>`).join('');
}

function resetTxnForm() {
  el('tEditingId').value = ''; el('tDate').value = new Date().toISOString().slice(0,10); el('tAmount').value = '';
  el('tRemarks').value = ''; el('tSubmitBtn').textContent = '+ Add Payment'; el('tCancelBtn').style.display = 'none';
}

window.editTxn = (accNo, txnId) => {
  const txn = transactions[accNo].find(x => x.txnId === txnId);
  el('tEditingId').value = txn.txnId; el('tDate').value = txn.date; el('tAmount').value = txn.amount;
  el('tRemarks').value = txn.remarks; el('tSubmitBtn').textContent = 'Update'; el('tCancelBtn').style.display = 'inline-flex';
};

window.deleteTxn = (accNo, txnId) => {
  if(!confirm('Delete transaction?')) return;
  transactions[accNo] = transactions[accNo].filter(x => x.txnId !== txnId); recalculateClientTotals(accNo);
};

el('txnForm').addEventListener('submit', (e) => {
  e.preventDefault(); const accNo = el('activeLedgerAccount').value; const txnId = el('tEditingId').value;
  const data = { date: el('tDate').value, amount: Number(el('tAmount').value)||0, remarks: el('tRemarks').value.trim() };

  if(txnId) {
    const idx = transactions[accNo].findIndex(x => x.txnId === txnId); transactions[accNo][idx] = {...transactions[accNo][idx], ...data};
  } else {
    if(!transactions[accNo]) transactions[accNo] = []; transactions[accNo].push({ txnId: uid(), ...data });
  }
  recalculateClientTotals(accNo); resetTxnForm();
});

function recalculateClientTotals(accNo) {
  const client = clients.find(c => c.accountNo === accNo); if(!client) return;
  const txns = transactions[accNo] || []; client.totalDeposit = txns.reduce((sum, t) => sum + (Number(t.amount)||0), 0);
  
  if (client.openedOn && client.amount > 0) {
    const monthsPaid = Math.floor(client.totalDeposit / client.amount);
    const d = new Date(client.openedOn); d.setMonth(d.getMonth() + monthsPaid); client.nextDueDate = d.toISOString().slice(0,10);
  }
  dirty = true; markUnsaved(); renderLedgerTable(accNo); renderMasterTable();      
}

/* ============================================================
   FORWARD & DOWNLOAD 
   ============================================================ */
window.forwardLedger = async () => {
  const accNo = el('activeLedgerAccount').value; const c = clients.find(x => x.accountNo === accNo);
  const txns = [...(transactions[accNo] || [])].sort((a,b) => (a.date < b.date ? 1 : -1));
  let text = `*Ledger Summary: ${c.holderName}*\nA/C: ${c.accountNo}\n\n*Total Deposit:* ${fmtMoney(c.totalDeposit)}\n*Next Due:* ${fmtDate(c.nextDueDate)}\n\n*Recent Payments:*\n`;
  txns.slice(0, 10).forEach(t => { text += `• ${fmtDate(t.date)}: ${fmtMoney(t.amount)} ${t.remarks ? '('+t.remarks+')' : ''}\n`; });
  if (navigator.share) { try { await navigator.share({ title: `Ledger ${c.holderName}`, text: text }); } catch(e) {} } else { window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank'); }
};

window.downloadLedger = () => {
  const accNo = el('activeLedgerAccount').value; const c = clients.find(x => x.accountNo === accNo);
  const txns = [...(transactions[accNo] || [])].sort((a,b) => (a.date > b.date ? 1 : -1)); 
  const wb = XLSX.utils.book_new(); const rows = txns.map(t => ({'Date': t.date, 'Amount': t.amount, 'Remarks': t.remarks}));
  const ws = XLSX.utils.json_to_sheet([ {'Date': 'Account', 'Amount': c.accountNo, 'Remarks': ''}, {'Date': 'Total Dep', 'Amount': c.totalDeposit, 'Remarks': ''}, {'Date': '', 'Amount': '', 'Remarks': ''} ].concat(rows), {skipHeader: true});
  XLSX.utils.book_append_sheet(wb, ws, String(c.accountNo).substring(0,31)); XLSX.writeFile(wb, `${c.holderName.replace(/\s+/g,'_')}_Ledger.xlsx`);
};

/* ============================================================
   SAVE CLOUD & EXPORT MASTER
   ============================================================ */
function markUnsaved() { el('saveStatusLine').textContent = "⚠️ Unsaved changes. Click Sync Cloud."; el('btnSaveSheet').style.backgroundColor = "var(--danger)"; }

el('btnSaveSheet').addEventListener('click', async () => {
  const btn = el('btnSaveSheet'); btn.disabled = true; el('saveStatusLine').textContent = 'Syncing...';
  
  const masterPayload = clients.map(c => ({ 'Account No.': c.accountNo, 'Amount': c.amount, 'Account Holder Name': c.holderName, 'Next Due Date': c.nextDueDate, 'Total Deposit': c.totalDeposit, 'Opened On': c.openedOn, 'Short Code': c.shortCode }));
  const txnPayload = {}; Object.keys(transactions).forEach(acc => { txnPayload[acc] = transactions[acc].map(t => ({ 'Txn ID': t.txnId, 'Date': t.date, 'Amount': t.amount, 'Remarks': t.remarks })); });

  try {
    const res = await fetch(sheetUrl, { method: 'POST', body: JSON.stringify({ pin: activePin, clients: masterPayload, transactions: txnPayload }) });
    if (!res.ok) throw new Error("Failed"); const responseData = await res.json();
    if (responseData.error) throw new Error(responseData.error);
    dirty = false; el('saveStatusLine').textContent = `Cloud Synced!`; btn.style.backgroundColor = "var(--ink)";
  } catch(err) { el('saveStatusLine').textContent = 'Error: ' + err.message; } finally { btn.disabled = false; }
});

el('btnDownloadXlsx').addEventListener('click', () => {
  const wb = XLSX.utils.book_new();
  const masterRows = clients.map(c => ({ 'Account No.': c.accountNo, 'Amount': c.amount, 'Holder Name': c.holderName, 'Next Due': c.nextDueDate, 'Total Deposit': c.totalDeposit, 'Opened': c.openedOn }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(masterRows), 'Master');
  clients.forEach(c => { const tRows = (transactions[c.accountNo]||[]).map(t => ({'Date': t.date, 'Amount': t.amount, 'Remarks': t.remarks})); if(tRows.length > 0) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tRows), String(c.accountNo).substring(0,31)); });
  XLSX.writeFile(wb, `RD-Ledger-${new Date().toISOString().slice(0,10)}.xlsx`);
});

window.addEventListener('beforeunload', (e) => { if(dirty){ e.preventDefault(); e.returnValue = ''; } });
</script>
