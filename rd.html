<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16302A">
<title>RD Register — Master & Ledger Management v1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F1EEE2; --paper-2:#E8E4D3; --ink:#16302A; --ink-soft:#3E5850;
    --rule:#C9C2A6; --rule-strong:#16302A; --brass:#9C6B22; --brass-2:#B98A3B;
    --danger:#8C3A2B; --danger-soft:#F3DCD5; --ok:#2F6B4F; --radius:3px;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans', sans-serif; font-size:14px; min-height:100vh; padding-bottom:60px;}
  .nums{font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;}
  
  .band{background:var(--ink); color:var(--paper); padding:22px 28px 18px; border-bottom:4px double var(--brass-2);}
  .band-inner{max-width:1180px; margin:0 auto; display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap;}
  .brand h1{font-family:'Fraunces', serif; font-size:26px; margin:0 0 3px;}
  .brand p{margin:0; color:#C9CFC9; font-size:12.5px;}
  .conn-status{font-size:12px; display:flex; align-items:center; gap:8px; color:#C9CFC9;}
  .dot{width:7px; height:7px; border-radius:50%; background:#7A8C86; display:inline-block;} .dot.on{background:#7FC79A;}
  
  .wrap{max-width:1180px; margin:0 auto; padding:22px 28px;}
  .panel{background:var(--paper-2); border:1px solid var(--rule); border-radius:var(--radius); padding:16px 18px; margin-bottom:18px;}
  .panel h2{font-family:'Fraunces', serif; font-size:15px; margin:0 0 12px; display:flex; align-items:center; gap:8px;}
  .panel h2 .idx{color:var(--brass); font-family:'IBM Plex Mono',monospace; font-size:12px;}
  
  .grid{display:grid; gap:10px 14px;} .cols-4{grid-template-columns:repeat(4,1fr);} .cols-2{grid-template-columns:repeat(2,1fr);}
  label{display:block; font-size:11px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:4px;}
  input, select{width:100%; padding:8px 9px; border:1px solid var(--rule); background:#FBFAF4; border-radius:2px; font-family:inherit; font-size:13.5px;}
  input:focus, select:focus{outline:2px solid var(--brass-2); border-color:var(--brass-2);}
  
  .btn{display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:2px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); font-size:13px; font-weight:500; cursor:pointer;}
  .btn:hover{background:#0F241F;} .btn.secondary{background:transparent; color:var(--ink); border-color:var(--rule-strong);} .btn.secondary:hover{background:#e4dfc9;}
  .btn.brass{background:var(--brass); border-color:var(--brass); color:#fff;} .btn.brass:hover{background:#845A1B;}
  .btn.danger{background:transparent; color:var(--danger); border-color:var(--danger);} .btn:disabled{opacity:0.45; cursor:not-allowed;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;} .btn-sm{padding:4px 9px; font-size:12px;}
  .status-line{font-size:12.5px; margin-top:10px; color:var(--ink-soft);} .status-line.ok{color:var(--ok);}
  
  .table-wrap{background:#FBFAF4; border:1px solid var(--rule); border-radius:var(--radius); overflow-x:auto;}
  table{width:100%; border-collapse:collapse; min-width:920px;}
  thead th{text-align:left; font-size:11px; text-transform:uppercase; color:var(--ink-soft); padding:10px 12px; border-bottom:2px solid var(--rule-strong); background:var(--paper-2); cursor:pointer;}
  tbody td{padding:9px 12px; border-bottom:1px solid var(--rule); white-space:nowrap;}
  tbody tr:hover{background:#F3EEDD;} .num-cell{text-align:right;}
  .badge{display:inline-block; padding:2px 8px; border:1px solid var(--brass); color:var(--brass); border-radius:20px; font-size:11.5px;}
  
  .overlay{position:fixed; inset:0; background:rgba(22,48,42,0.6); display:none; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--paper); border:1px solid var(--rule-strong); border-radius:var(--radius); max-width:560px; width:100%; padding:22px 24px; max-height:90vh; overflow-y:auto;}
  .modal.large{max-width:800px;}
  .modal h3{font-family:'Fraunces',serif; font-size:18px; margin:0 0 16px;}
  
  .ledger-box{background:#FBFAF4; border:1px solid var(--rule); padding:12px; margin-bottom:14px; border-radius:var(--radius);}
  .ledger-table th, .ledger-table td{font-size:12.5px; padding:6px 8px;}
  .ledger-form{display:flex; gap:10px; align-items:flex-end; background:var(--paper-2); padding:10px; border-radius:var(--radius);}
</style>
</head>
<body>

<div class="band">
  <div class="band-inner">
    <div class="brand">
      <h1>RD Register</h1>
      <p>Automated Master & Individual Client Ledgers — Synced to Google Sheets</p>
    </div>
    <div class="conn-status">
      <span class="dot off" id="connDot"></span><span id="connText">Connecting...</span>
    </div>
  </div>
</div>

<div class="wrap" id="appArea" style="display:none;">

  <div class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <h2 style="margin:0;"><span class="idx">01</span> Master Client List</h2>
      <div class="btn-row" style="margin:0;">
        <button class="btn brass" id="btnAddClient">+ Add client</button>
        <button class="btn" id="btnSaveSheet" disabled>Save Master & Ledgers to Sheet</button>
        <button class="btn secondary" id="btnDownloadXlsx">Download Offline .xlsx</button>
      </div>
    </div>
    <div class="status-line" id="saveStatusLine" style="margin-top:8px;"></div>

    <div class="table-wrap" style="margin-top:14px;">
      <table id="clientsTable">
        <thead>
          <tr>
            <th>Account No.</th> <th>Amount</th> <th>Holder Name</th> <th>Next Due Date</th>
            <th>Total Deposit</th> <th>Opened On</th> <th>Short Code</th> <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- CLIENT DETAILS MODAL -->
<div class="overlay" id="overlayClient">
  <div class="modal">
    <h3 id="modalTitle">Add Client</h3>
    <form id="clientForm">
      <input type="hidden" id="fEditingId">
      <div class="grid cols-2">
        <div><label>Account No. *</label><input type="text" id="fAccountNo" required></div>
        <div><label>Short Code</label><input type="text" id="fShortCodeInput"></div>
        <div><label>Account Holder Name *</label><input type="text" id="fHolderName" required></div>
        <div><label>Amount (Installment) *</label><input type="number" step="0.01" id="fAmount" required></div>
        <div><label>Total Deposit</label><input type="number" step="0.01" id="fTotalDeposit" readonly title="Auto-calculated from ledger"></div>
        <div><label>Opened On</label><input type="date" id="fOpenedOn"></div>
        <div><label>Next Due Date</label><input type="date" id="fNextDueDate" title="Auto-advances when payments are added"></div>
      </div>
      <div class="btn-row" style="justify-content:flex-end; margin-top:20px;">
        <button type="button" class="btn secondary" onclick="el('overlayClient').classList.remove('show')">Cancel</button>
        <button type="submit" class="btn brass">Save Client Profile</button>
      </div>
    </form>
  </div>
</div>

<!-- LEDGER TRANSACTIONS MODAL -->
<div class="overlay" id="overlayLedger">
  <div class="modal large">
    <h3 id="ledgerTitle">Ledger Details</h3>
    <input type="hidden" id="activeLedgerAccount">
    
    <div class="grid cols-2 ledger-box">
      <div><label>Total Deposit</label><div class="nums" id="ledgerTotal" style="font-size:18px; font-weight:600;">₹0</div></div>
      <div><label>Next Due Date</label><div class="nums" id="ledgerDue" style="font-size:18px; font-weight:600;">—</div></div>
    </div>

    <form class="ledger-form" id="txnForm">
      <input type="hidden" id="tEditingId">
      <div style="flex:1"><label>Date</label><input type="date" id="tDate" required></div>
      <div style="flex:1"><label>Amount Received</label><input type="number" step="0.01" id="tAmount" required></div>
      <div style="flex:2"><label>Remarks</label><input type="text" id="tRemarks" placeholder="Optional notes"></div>
      <button type="submit" class="btn brass" id="tSubmitBtn">Add Record</button>
      <button type="button" class="btn secondary" id="tCancelBtn" style="display:none;" onclick="resetTxnForm()">Cancel</button>
    </form>

    <div class="table-wrap" style="margin-top:14px; max-height:40vh;">
      <table class="ledger-table">
        <thead><tr><th>Date</th> <th>Amount</th> <th>Remarks</th> <th style="text-align:right;">Actions</th></tr></thead>
        <tbody id="ledgerTableBody"></tbody>
      </table>
    </div>
    
    <div class="btn-row" style="justify-content:flex-end; margin-top:16px;">
      <button class="btn secondary" onclick="el('overlayLedger').classList.remove('show')">Close Ledger</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   STATE & CONFIGURATION
   ============================================================ */
// ** PASTE YOUR NEW APPS SCRIPT URL HERE **
const sheetUrl = "https://script.google.com/macros/s/AKfycbzWRoN9uB3kmsQCmeB8P4OsouTlsX-6werl3Bq6V1jkCofKE7vK7lWn5TLlo46Nb0c/exec";

let clients = [];          
let transactions = {}; // format: { "AccountNo": [ {txnId, date, amount, remarks} ] }
let dirty = false;

const el = id => document.getElementById(id);
const uid = () => 'id_' + Math.random().toString(36).substr(2, 9);
const toISODate = (v) => v ? new Date(v).toISOString().slice(0,10) : '';
const fmtMoney = (n) => '₹' + (Number(n)||0).toLocaleString('en-IN', {maximumFractionDigits:2});
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) : '—';
const escapeHtml = (s) => String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* ============================================================
   INITIALIZATION & GOOGLE SHEETS SYNC
   ============================================================ */
window.addEventListener('DOMContentLoaded', async () => {
  try {
    const res = await fetch(sheetUrl);
    if (!res.ok) throw new Error("Fetch failed.");
    const result = await res.json();
    
    // Parse Master Clients
    clients = (result.clients || []).map(r => ({
      id: uid(),
      accountNo: String(r['Account No.'] || '').trim(),
      amount: Number(r['Amount']) || 0,
      holderName: String(r['Account Holder Name'] || '').trim(),
      nextDueDate: toISODate(r['Next Due Date']),
      totalDeposit: Number(r['Total Deposit']) || 0,
      openedOn: toISODate(r['Opened On']),
      shortCode: String(r['Short Code'] || '').trim(),
    })).filter(c => c.accountNo !== '');

    // Parse Transactions (Client Tabs)
    transactions = {};
    Object.keys(result.transactions || {}).forEach(accNo => {
      transactions[accNo] = result.transactions[accNo].map(t => ({
        txnId: t['Txn ID'] || uid(),
        date: toISODate(t['Date']),
        amount: Number(t['Amount']) || 0,
        remarks: String(t['Remarks'] || '')
      }));
    });

    el('connDot').className = 'dot on';
    el('connText').textContent = 'Connected to Google Sheets (Master + Tabs)';
    el('btnSaveSheet').disabled = false;
    el('appArea').style.display = 'block';
    renderMasterTable();
  } catch(err) {
    el('connText').textContent = 'Connection failed: ' + err.message;
    alert("Error loading data from Google Sheets.");
  }
});

/* ============================================================
   MASTER TABLE LOGIC
   ============================================================ */
function renderMasterTable(){
  const tbody = el('tableBody');
  if(clients.length === 0){
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:30px; font-style:italic;">No clients found. Add one above.</td></tr>`;
    return;
  }
  tbody.innerHTML = clients.map(c => `
    <tr>
      <td class="nums"><b>${escapeHtml(c.accountNo)}</b></td>
      <td class="nums num-cell">${fmtMoney(c.amount)}</td>
      <td>${escapeHtml(c.holderName)}</td>
      <td>${fmtDate(c.nextDueDate)}</td>
      <td class="nums num-cell" style="font-weight:600; color:var(--ok);">${fmtMoney(c.totalDeposit)}</td>
      <td>${fmtDate(c.openedOn)}</td>
      <td>${c.shortCode ? `<span class="badge">${escapeHtml(c.shortCode)}</span>` : '—'}</td>
      <td>
        <div class="btn-row" style="margin:0;">
          <button class="btn brass btn-sm" onclick="openLedger('${c.accountNo}')">📖 Ledger</button>
          <button class="btn secondary btn-sm" onclick="editClient('${c.id}')">Edit</button>
          <button class="btn danger btn-sm" onclick="deleteClient('${c.id}')">Del</button>
        </div>
      </td>
    </tr>`).join('');
}

/* ============================================================
   CLIENT PROFILE (MASTER) ADD/EDIT/DELETE
   ============================================================ */
el('btnAddClient').addEventListener('click', () => {
  el('clientForm').reset();
  el('fEditingId').value = '';
  el('fTotalDeposit').value = 0;
  el('fOpenedOn').value = new Date().toISOString().slice(0,10);
  el('modalTitle').textContent = 'Add New Client';
  el('overlayClient').classList.add('show');
});

window.editClient = (id) => {
  const c = clients.find(x => x.id === id);
  if(!c) return;
  el('fEditingId').value = c.id;
  el('fAccountNo').value = c.accountNo;
  el('fShortCodeInput').value = c.shortCode;
  el('fHolderName').value = c.holderName;
  el('fAmount').value = c.amount;
  el('fTotalDeposit').value = c.totalDeposit;
  el('fOpenedOn').value = c.openedOn;
  el('fNextDueDate').value = c.nextDueDate;
  el('modalTitle').textContent = `Edit Profile: ${c.accountNo}`;
  el('overlayClient').classList.add('show');
};

el('clientForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const id = el('fEditingId').value;
  const accNo = el('fAccountNo').value.trim();
  
  if(clients.some(c => c.accountNo === accNo && c.id !== id)){
    alert("Account Number already exists! Tabs must have unique account numbers."); return;
  }

  const data = {
    accountNo: accNo,
    shortCode: el('fShortCodeInput').value.trim(),
    holderName: el('fHolderName').value.trim(),
    amount: Number(el('fAmount').value)||0,
    totalDeposit: Number(el('fTotalDeposit').value)||0,
    openedOn: el('fOpenedOn').value,
    nextDueDate: el('fNextDueDate').value,
  };

  if(id){
    const idx = clients.findIndex(x => x.id === id);
    const oldAcc = clients[idx].accountNo;
    clients[idx] = {...clients[idx], ...data};
    // Migrate transaction array if Account No. was renamed
    if(oldAcc !== accNo) {
      transactions[accNo] = transactions[oldAcc] || [];
      delete transactions[oldAcc];
    }
  } else {
    clients.push({id: uid(), ...data});
    transactions[accNo] = []; // Initialize empty ledger for new client tab
  }

  dirty = true;
  el('saveStatusLine').textContent = "Changes saved locally. Click 'Save Master & Ledgers' to push to Google Sheets.";
  el('overlayClient').classList.remove('show');
  renderMasterTable();
});

window.deleteClient = (id) => {
  const c = clients.find(x => x.id === id);
  if(!confirm(`Delete Master profile AND entire ledger tab for ${c.accountNo}?`)) return;
  clients = clients.filter(x => x.id !== id);
  delete transactions[c.accountNo];
  dirty = true;
  renderMasterTable();
};

/* ============================================================
   INDIVIDUAL LEDGER LOGIC (TRANSACTIONS)
   ============================================================ */
window.openLedger = (accNo) => {
  const c = clients.find(x => x.accountNo === accNo);
  el('ledgerTitle').textContent = `Ledger: ${c.holderName} (${c.accountNo})`;
  el('activeLedgerAccount').value = accNo;
  resetTxnForm();
  renderLedgerTable(accNo);
  el('overlayLedger').classList.add('show');
};

function renderLedgerTable(accNo) {
  const c = clients.find(x => x.accountNo === accNo);
  el('ledgerTotal').textContent = fmtMoney(c.totalDeposit);
  el('ledgerDue').textContent = fmtDate(c.nextDueDate);
  
  const txns = transactions[accNo] || [];
  const tbody = el('ledgerTableBody');
  if(txns.length === 0){
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:15px;">No transactions recorded yet.</td></tr>`;
    return;
  }
  
  // Sort descending by date
  const sorted = [...txns].sort((a,b) => (a.date < b.date ? 1 : -1));
  tbody.innerHTML = sorted.map(t => `
    <tr>
      <td>${fmtDate(t.date)}</td>
      <td class="nums"><b>${fmtMoney(t.amount)}</b></td>
      <td>${escapeHtml(t.remarks)}</td>
      <td style="text-align:right;">
        <button class="btn secondary btn-sm" onclick="editTxn('${accNo}', '${t.txnId}')">Edit</button>
        <button class="btn danger btn-sm" onclick="deleteTxn('${accNo}', '${t.txnId}')">Del</button>
      </td>
    </tr>`).join('');
}

function resetTxnForm() {
  el('tEditingId').value = '';
  el('tDate').value = new Date().toISOString().slice(0,10);
  el('tAmount').value = '';
  el('tRemarks').value = '';
  el('tSubmitBtn').textContent = 'Add Record';
  el('tCancelBtn').style.display = 'none';
}

window.editTxn = (accNo, txnId) => {
  const txn = transactions[accNo].find(x => x.txnId === txnId);
  el('tEditingId').value = txn.txnId;
  el('tDate').value = txn.date;
  el('tAmount').value = txn.amount;
  el('tRemarks').value = txn.remarks;
  el('tSubmitBtn').textContent = 'Update Record';
  el('tCancelBtn').style.display = 'inline-flex';
};

window.deleteTxn = (accNo, txnId) => {
  if(!confirm('Delete this transaction?')) return;
  transactions[accNo] = transactions[accNo].filter(x => x.txnId !== txnId);
  recalculateClientTotals(accNo);
};

el('txnForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const accNo = el('activeLedgerAccount').value;
  const txnId = el('tEditingId').value;
  
  const data = {
    date: el('tDate').value,
    amount: Number(el('tAmount').value) || 0,
    remarks: el('tRemarks').value.trim()
  };

  if(txnId) {
    const idx = transactions[accNo].findIndex(x => x.txnId === txnId);
    transactions[accNo][idx] = {...transactions[accNo][idx], ...data};
  } else {
    if(!transactions[accNo]) transactions[accNo] = [];
    transactions[accNo].push({ txnId: uid(), ...data });
  }

  recalculateClientTotals(accNo);
  resetTxnForm();
});

// CORE LOGIC: Auto-calculate Master Totals and Due Dates based on Ledger
function recalculateClientTotals(accNo) {
  const client = clients.find(c => c.accountNo === accNo);
  if(!client) return;
  
  const txns = transactions[accNo] || [];
  // 1. Sum up all ledger payments
  client.totalDeposit = txns.reduce((sum, t) => sum + (Number(t.amount)||0), 0);
  
  // 2. Auto-advance due date (Total Deposit divided by Installment Amount = months paid)
  if (client.openedOn && client.amount > 0) {
    const monthsPaid = Math.floor(client.totalDeposit / client.amount);
    const d = new Date(client.openedOn);
    d.setMonth(d.getMonth() + monthsPaid);
    client.nextDueDate = d.toISOString().slice(0,10);
  }

  dirty = true;
  el('saveStatusLine').textContent = "Ledger updated locally. Click 'Save' to push tabs to Sheets.";
  renderLedgerTable(accNo); // Update modal UI
  renderMasterTable();      // Update background master UI
}

/* ============================================================
   SAVE TO GOOGLE SHEETS / EXPORT
   ============================================================ */
el('btnSaveSheet').addEventListener('click', async () => {
  const btn = el('btnSaveSheet');
  btn.disabled = true;
  el('saveStatusLine').textContent = 'Pushing Master and all Ledgers to Google Sheets...';
  
  // Prepare payload mapping
  const masterPayload = clients.map(c => ({
    'Account No.': c.accountNo, 'Amount': c.amount, 'Account Holder Name': c.holderName,
    'Next Due Date': c.nextDueDate, 'Total Deposit': c.totalDeposit, 
    'Opened On': c.openedOn, 'Short Code': c.shortCode
  }));

  const txnPayload = {};
  Object.keys(transactions).forEach(acc => {
    txnPayload[acc] = transactions[acc].map(t => ({
      'Txn ID': t.txnId, 'Date': t.date, 'Amount': t.amount, 'Remarks': t.remarks
    }));
  });

  try {
    const res = await fetch(sheetUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ clients: masterPayload, transactions: txnPayload })
    });
    if (!res.ok) throw new Error("Failed to save data.");
    dirty = false;
    el('saveStatusLine').textContent = `Success! Saved Master and ${Object.keys(transactions).length} Ledger tab(s).`;
  } catch(err) {
    el('saveStatusLine').textContent = 'Error: ' + err.message;
  } finally {
    btn.disabled = false;
  }
});

// Download multi-sheet Excel file
el('btnDownloadXlsx').addEventListener('click', () => {
  const wb = XLSX.utils.book_new();
  // Master Sheet
  const masterRows = clients.map(c => ({
    'Account No.': c.accountNo, 'Amount': c.amount, 'Holder Name': c.holderName,
    'Next Due': c.nextDueDate, 'Total Deposit': c.totalDeposit, 'Opened': c.openedOn
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(masterRows), 'Master');
  
  // Client Tabs
  clients.forEach(c => {
    const tRows = (transactions[c.accountNo]||[]).map(t => ({'Date': t.date, 'Amount': t.amount, 'Remarks': t.remarks}));
    if(tRows.length > 0) {
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tRows), String(c.accountNo).substring(0,31));
    }
  });
  XLSX.writeFile(wb, `RD-Ledger-${new Date().toISOString().slice(0,10)}.xlsx`);
});

window.addEventListener('beforeunload', (e) => { if(dirty){ e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
