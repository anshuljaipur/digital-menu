<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Complete Art Stager (Auto-Hiding Controls)</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f4f4f6; 
            margin: 0; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        .panel { 
            background: white; 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 850px; 
            box-sizing: border-box; 
            margin-bottom: 15px;
        }

        #main-container { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            width: 100%; 
            max-width: 850px; 
        }

        label { font-size: 13px; font-weight: bold; color: #444; display: block; margin-bottom: 5px; }
        .val-readout { font-weight: normal; color: #007bff; }
        
        input[type="number"], select, input[type="file"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            font-size: 16px; 
            box-sizing: border-box;
        }
        
        input[type="range"] { width: 100%; margin: 10px 0; }
        .control-group { margin-bottom: 15px; }
        
        .btn { 
            background: #ef4444; color: white; border: none; 
            padding: 15px; border-radius: 8px; cursor: pointer; 
            font-weight: bold; width: 100%; font-size: 16px; 
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        
        .btn-success { background: #10b981; margin-bottom: 15px; }

        canvas { 
            border: 1px solid #ccc; 
            background-color: #fff; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            width: 100%; 
            height: auto; 
            touch-action: none; 
            user-select: none; 
            border-radius: 8px;
        }

        /* Menu hides completely when no art is selected */
        .disabled { 
            display: none; 
        }

        @media (min-width: 768px) {
            #main-container { flex-direction: row; align-items: flex-start; }
            canvas { width: 600px; height: 450px; }
            #customizer { width: 320px; flex-shrink: 0; }
            .top-controls-wrapper { display: flex; gap: 20px; }
            .top-controls-wrapper .control-group { flex: 1; margin-bottom: 0; }
        }
    </style>
</head>
<body>

    <div class="panel">
        <div class="top-controls-wrapper">
            <div class="control-group">
                <label>1. Select Room Background</label>
                <input type="file" id="bgUpload" accept="image/*">
            </div>
            <div class="control-group">
                <label>2. Upload Custom Artwork</label>
                <input type="file" id="artUpload" accept="image/*">
            </div>
        </div>
    </div>

    <div id="main-container">
        
        <div>
            <button id="downloadBtn" class="btn btn-success">💾 Download Staged Scene</button>
            <canvas id="stageCanvas" width="800" height="600"></canvas>
        </div>

        <div id="customizer" class="panel disabled">
            <h3 style="margin: 0 0 15px 0; color: #2563eb; font-size: 18px;">Customize Selection</h3>
            
            <div class="control-group">
                <label>Width: <span class="val-readout" id="artWidthVal">36</span> in</label>
                <input type="range" id="artWidthSlider" min="10" max="80" step="1" value="36">
            </div>

            <div class="control-group">
                <label>Height: <span class="val-readout" id="artHeightVal">24</span> in</label>
                <input type="range" id="artHeightSlider" min="10" max="80" step="1" value="24">
            </div>

            <div class="control-group">
                <label>Frame Finish</label>
                <select id="frameColor">
                    <option value="none">Gallery Wrap (No Frame)</option>
                    <option value="#222222">Charcoal Black</option>
                    <option value="#e6c280">Gilded Gold</option>
                    <option value="#f1e4c3">Natural Maple</option>
                    <option value="#ffffff">Minimalist White</option>
                </select>
            </div>

            <div class="control-group">
                <label>Frame Thickness: <span class="val-readout" id="frameWidthVal">1.5</span> in</label>
                <input type="range" id="frameWidthSlider" min="0.5" max="4" step="0.25" value="1.5">
            </div>

            <div class="control-group">
                <label>Match Room Lighting (Brightness)</label>
                <input type="range" id="artBrightnessSlider" min="50" max="150" value="100">
            </div>

            <button id="deleteArt" class="btn">Remove Art Piece</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('stageCanvas');
        const ctx = canvas.getContext('2d');

        let roomImage = new Image();
        let paintings = [];          
        let selectedPainting = null; 
        let activePainting = null;   
        let dragOffset = { x: 0, y: 0 };
        
        const FIXED_PPI = 4; 

        // CrossOrigin allows downloading with external images
        roomImage.crossOrigin = "anonymous";
        roomImage.src = 'https://images.unsplash.com/photo-1513694203232-719a280e022f?w=800&auto=format&fit=crop';
        roomImage.onload = drawCanvas;

        document.getElementById('bgUpload').addEventListener('change', e => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = event => { roomImage.src = event.target.result; };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        document.getElementById('artUpload').addEventListener('change', e => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const defaultW = 36;
                        const defaultH = Math.round(defaultW * (img.height / img.width));
                        const item = {
                            img: img, 
                            realInchesW: defaultW, 
                            realInchesH: defaultH,
                            width: defaultW * FIXED_PPI, 
                            height: defaultH * FIXED_PPI,
                            x: canvas.width / 2 - (defaultW * FIXED_PPI / 2),
                            y: canvas.height / 2 - (defaultH * FIXED_PPI / 2),
                            frameColor: 'none', 
                            frameWidthInches: 1.5,
                            brightness: 100 
                        };
                        paintings.push(item);
                        setActivePainting(item);
                        e.target.value = ''; 
                    };
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const previouslySelected = activePainting;
            
            if (previouslySelected) {
                activePainting = null;
                drawCanvas();
            }

            const dataURL = canvas.toDataURL('image/png');

            const link = document.createElement('a');
            link.download = 'staged-art-scene.png';
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            if (previouslySelected) {
                activePainting = previouslySelected;
                drawCanvas();
            }
        });

        function setActivePainting(art) {
            activePainting = art;
            const panel = document.getElementById('customizer');
            
            if (!art) {
                panel.classList.add('disabled');
            } else {
                panel.classList.remove('disabled');
                document.getElementById('artWidthSlider').value = art.realInchesW;
                document.getElementById('artWidthVal').innerText = art.realInchesW;
                document.getElementById('artHeightSlider').value = art.realInchesH;
                document.getElementById('artHeightVal').innerText = art.realInchesH;
                document.getElementById('frameColor').value = art.frameColor;
                document.getElementById('frameWidthSlider').value = art.frameWidthInches;
                document.getElementById('frameWidthVal').innerText = art.frameWidthInches;
                document.getElementById('artBrightnessSlider').value = art.brightness;
            }
            drawCanvas();
        }

        document.getElementById('artWidthSlider').addEventListener('input', e => {
            if (activePainting) {
                activePainting.realInchesW = parseInt(e.target.value);
                document.getElementById('artWidthVal').innerText = activePainting.realInchesW;
                activePainting.width = activePainting.realInchesW * FIXED_PPI;
                drawCanvas();
            }
        });

        document.getElementById('artHeightSlider').addEventListener('input', e => {
            if (activePainting) {
                activePainting.realInchesH = parseInt(e.target.value);
                document.getElementById('artHeightVal').innerText = activePainting.realInchesH;
                activePainting.height = activePainting.realInchesH * FIXED_PPI;
                drawCanvas();
            }
        });

        document.getElementById('frameColor').addEventListener('change', e => { 
            if(activePainting) { activePainting.frameColor = e.target.value; drawCanvas(); } 
        });

        document.getElementById('frameWidthSlider').addEventListener('input', e => {
            if(activePainting) {
                activePainting.frameWidthInches = parseFloat(e.target.value);
                document.getElementById('frameWidthVal').innerText = activePainting.frameWidthInches;
                drawCanvas();
            }
        });

        document.getElementById('artBrightnessSlider').addEventListener('input', e => {
            if(activePainting) {
                activePainting.brightness = parseInt(e.target.value);
                drawCanvas();
            }
        });

        document.getElementById('deleteArt').addEventListener('click', () => { 
            if(activePainting) { paintings = paintings.filter(p => p !== activePainting); setActivePainting(null); } 
        });

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(roomImage, 0, 0, canvas.width, canvas.height);

            paintings.forEach(art => {
                ctx.save();
                
                let framePx = art.frameColor !== 'none' ? (art.frameWidthInches * FIXED_PPI) : 0;
                
                if (framePx > 0) {
                    ctx.fillStyle = art.frameColor;
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
                    ctx.shadowBlur = 18;
                    ctx.shadowOffsetY = 8;
                    ctx.fillRect(art.x - framePx, art.y - framePx, art.width + (framePx * 2), art.height + (framePx * 2));
                    ctx.shadowColor = 'transparent'; 
                } else {
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
                    ctx.shadowBlur = 12;
                    ctx.shadowOffsetY = 6;
                }

                ctx.filter = `brightness(${art.brightness}%)`;
                ctx.drawImage(art.img, art.x, art.y, art.width, art.height);
                ctx.restore();

                if (art === activePainting) {
                    ctx.strokeStyle = '#2563eb';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(art.x - framePx - 4, art.y - framePx - 4, art.width + (framePx * 2) + 8, art.height + (framePx * 2) + 8);
                }
            });
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX = e.clientX;
            let clientY = e.clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function handlePointerDown(e) {
            const pos = getPointerPos(e);
            let hit = false;

            for (let i = paintings.length - 1; i >= 0; i--) {
                let art = paintings[i];
                let f = art.frameColor !== 'none' ? (art.frameWidthInches * FIXED_PPI) : 0;

                if (pos.x >= art.x - f && pos.x <= art.x + art.width + f &&
                    pos.y >= art.y - f && pos.y <= art.y + art.height + f) {
                    
                    selectedPainting = art;
                    dragOffset.x = pos.x - art.x;
                    dragOffset.y = pos.y - art.y;
                    
                    paintings.splice(i, 1);
                    paintings.push(selectedPainting);
                    
                    setActivePainting(selectedPainting);
                    hit = true;
                    break;
                }
            }
            if (!hit) setActivePainting(null);
        }

        function handlePointerMove(e) {
            if (!selectedPainting) return;
            e.preventDefault(); 

            const pos = getPointerPos(e);
            selectedPainting.x = pos.x - dragOffset.x;
            selectedPainting.y = pos.y - dragOffset.y;
            drawCanvas();
        }

        function handlePointerUp() { selectedPainting = null; }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
        canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
        window.addEventListener('touchend', handlePointerUp);
    </script>
</body>
</html>
