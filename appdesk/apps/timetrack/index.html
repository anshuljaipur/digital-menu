<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Time Tracker</title>
<link rel="stylesheet" href="../../common.css">
<script src="../../firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head><body>
<h1>⏱️ Staff Time Tracker <button class="sm" id="out">Sign out</button></h1>
<div class="card"><div id="status" style="font-size:17px;margin-bottom:8px"></div>
  <input id="note" placeholder="Details for the next action (optional)" style="width:100%;margin-bottom:8px">
  <div class="row" id="btns"></div></div>
<div class="card"><div class="row"><label>From <input type="date" id="f"></label><label>To <input type="date" id="t"></label></div>
  <div class="stats"><div>Total working time<b id="sw"></b></div><div>Total break time<b id="sb"></b></div><div>Shift span (work + break)<b id="sg"></b></div></div></div>
<div class="card" style="overflow-x:auto"><table><thead><tr><th>Type</th><th>Start</th><th>End</th><th>Duration</th><th>Details</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="row"><button class="pri" id="pdf">Export PDF</button><button class="pri" id="img">Export image</button></div>
<div id="rep" style="position:fixed;left:-9999px;top:0"></div>
<script type="module">
import {boot,db,collection,doc,addDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,limit,logout,esc} from '../../common.js';
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
let logs=[],col;
const dur=ms=>{ms=Math.max(0,Math.round(ms/1000));return Math.floor(ms/3600)+'h '+pad(Math.floor(ms%3600/60))+'m '+pad(ms%60)+'s'};
const loc=ms=>ms?new Date(ms-new Date(ms).getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
const fmt=ms=>ms?new Date(ms).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:true}):'—';
$('#f').value=$('#t').value=loc(Date.now()).slice(0,10);
$('#out').onclick=logout;
const open=k=>logs.find(l=>l.kind===k&&!l.end);
const inRange=l=>l.start>=new Date($('#f').value+'T00:00').getTime()&&l.start<=new Date($('#t').value+'T23:59:59.999').getTime();
boot(u=>{col=collection(db,'timetrack_users',u.uid,'logs');
  onSnapshot(query(col,orderBy('start','desc'),limit(500)),s=>{logs=s.docs.map(d=>({id:d.id,...d.data()}));draw()})});
async function act(a){
  const now=Date.now(),note=$('#note').value.trim(),w=open('work'),b=open('break');$('#note').value='';
  if(a==='sw')await addDoc(col,{kind:'work',start:now,end:null,note});
  if(a==='sb')await addDoc(col,{kind:'break',start:now,end:null,note});
  if(a==='eb'&&b)await updateDoc(doc(col,b.id),{end:now});
  if(a==='ew'){if(b)await updateDoc(doc(col,b.id),{end:now});if(w)await updateDoc(doc(col,w.id),{end:now})}
}
$('#btns').onclick=e=>{if(e.target.dataset.a)act(e.target.dataset.a)};
function draw(){
  const W=open('work'),B=open('break');
  $('#btns').innerHTML=!W?'<button class="ok" data-a="sw">▶ Start work</button>':B?'<button class="pri" data-a="eb">☕ End break</button><button class="no" data-a="ew">■ End work</button>':'<button class="pri" data-a="sb">☕ Start break</button><button class="no" data-a="ew">■ End work</button>';
  $('#rows').innerHTML=logs.filter(inRange).map(l=>`<tr data-id="${l.id}"><td>${l.kind==='work'?'Work':'Break'}</td><td><input type="datetime-local" data-k="start" value="${loc(l.start)}"></td><td><input type="datetime-local" data-k="end" value="${loc(l.end)}"></td><td>${l.end?dur(l.end-l.start):'running'}</td><td><input data-k="note" value="${esc(l.note)}"></td><td><button class="sm" data-del>✕</button></td></tr>`).join('')||'<tr><td colspan="6" class="mut">No entries in this range</td></tr>';
  tick();
}
function tick(){
  const now=Date.now();let w=0,b=0;
  logs.filter(inRange).forEach(l=>{const d=(l.end||now)-l.start;l.kind==='work'?w+=d:b+=d});
  $('#sw').textContent=dur(w-b);$('#sb').textContent=dur(b);$('#sg').textContent=dur(w);
  const W=open('work'),B=open('break');
  $('#status').textContent=B?'🟠 On break since '+fmt(B.start):W?'🟢 Working since '+fmt(W.start):'⚪ Not working';
}
setInterval(tick,1000);
$('#f').onchange=$('#t').onchange=draw;
$('#rows').onchange=e=>{const i=e.target,k=i.dataset.k;if(!k)return;const v=k==='note'?i.value:(i.value?new Date(i.value).getTime():null);if(k==='start'&&!v)return;updateDoc(doc(col,i.closest('tr').dataset.id),{[k]:v})};
$('#rows').onclick=e=>{if(e.target.dataset.del!==undefined&&confirm('Delete this entry?'))deleteDoc(doc(col,e.target.closest('tr').dataset.id))};
async function snap(){
  const td=x=>`<td style="border:1px solid #ccc;padding:5px">${x}</td>`,L=logs.filter(inRange).slice().reverse();
  $('#rep').innerHTML=`<div id="rp" style="background:#fff;color:#111;padding:20px;width:800px;font:14px system-ui,sans-serif"><h2 style="margin:0 0 4px">Staff Time Report</h2><div>${$('#f').value} to ${$('#t').value}</div><p><b>Total working time:</b> ${$('#sw').textContent} &nbsp;&nbsp; <b>Total break time:</b> ${$('#sb').textContent}</p><table style="width:100%;border-collapse:collapse"><tr style="background:#eee">${['Type','Start','End','Duration','Details'].map(h=>`<td style="border:1px solid #ccc;padding:5px"><b>${h}</b></td>`).join('')}</tr>${L.map(l=>`<tr>${td(l.kind==='work'?'Work':'Break')}${td(fmt(l.start))}${td(fmt(l.end))}${td(l.end?dur(l.end-l.start):'running')}${td(esc(l.note))}</tr>`).join('')}</table></div>`;
  return html2canvas($('#rp'),{scale:2,backgroundColor:'#fff'});
}
$('#img').onclick=async()=>{const c=await snap(),a=document.createElement('a');a.download='time-report.png';a.href=c.toDataURL('image/png');a.click()};
$('#pdf').onclick=async()=>{
  const c=await snap(),img=c.toDataURL('image/png'),p=new window.jspdf.jsPDF('p','mm','a4'),w=190,h=c.height*w/c.width;
  let off=0;p.addImage(img,'PNG',10,0,w,h);while(h-off>297){off+=297;p.addPage();p.addImage(img,'PNG',10,-off,w,h)}
  p.save('time-report.pdf');
};
</script></body></html>
