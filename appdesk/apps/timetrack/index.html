<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Work Time Tracker</title>
<link rel="stylesheet" href="../../common.css">
<script src="../../firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#1f2937;--mut:#6b7280;--bd:#e5e7eb;--ac:#2b6be0;color-scheme:light}
body{max-width:1040px;padding:20px 12px}
.wrap{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:24px 28px}
@media(max-width:600px){.wrap{padding:16px}.panel{grid-template-columns:1fr!important}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{margin:0;color:#1a7f4b;font-size:26px}
.sub{display:flex;justify-content:space-between;color:#6b7280;font-size:13px;margin:6px 0 16px}
.panel{background:#eaf6ee;border-radius:10px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:center}
.panel b{display:block;margin-bottom:10px}.bs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.panel button{border:0;color:#fff;border-radius:6px;padding:9px 14px;font-size:14px}
.panel button.g{background:#28a745}.panel button.r{background:#dc3545}
.panel button:disabled{opacity:.45;cursor:not-allowed}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px;margin-top:12px}
table{border-collapse:collapse;min-width:640px}
th{background:#f8f9fa;font-size:13px}th,td{text-align:center;padding:12px 8px;border-bottom:1px solid var(--bd);white-space:normal;font-size:14px}
tr:last-child td{border-bottom:0}td input{width:100%;min-width:150px;font-size:13px}
table button.sm{background:#eee;border:0;border-radius:4px;padding:5px 10px;font-size:12px;font-weight:600}
.fb{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:5px}.fb select{font-size:12px;padding:3px;max-width:96px}
table .fb button.sm.on{background:#2b6be0;color:#fff}
.cl td{color:#9ca3af;font-style:italic}
.cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.cd{background:#fafafa;border:1px solid #eee;border-radius:8px;padding:12px 18px;min-width:170px}.cd small{color:#6b7280;font-size:12px}.cd div{font-size:18px;margin-top:6px}
button.ex{display:block;width:100%;border:0;border-radius:6px;color:#fff;padding:14px;font-weight:700;margin-bottom:10px;font-size:15px}
button.ex:disabled{opacity:.45;cursor:not-allowed}
#fl{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:50;display:none;flex-direction:column;gap:8px;background:rgba(255,255,255,.96);padding:8px;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
#fl.on{display:flex}
#fl button{border:0;color:#fff;border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;width:96px}
@media(max-width:600px){#fl{right:6px}#fl button{width:76px;padding:9px 4px;font-size:12px}}
#fl button.g{background:#28a745}#fl button.r{background:#dc3545}#fl button:disabled{opacity:.4;cursor:not-allowed}
</style></head><body>
<div class="wrap">
  <div class="top"><h2>Staff Work Time Tracker</h2><button class="sm" id="out">Sign out</button></div>
  <div class="sub"><span id="dt"></span><span id="clk"></span></div>
  <div class="panel">
    <div><b>Main Working</b><div class="bs"><button class="g" id="bsw" data-act="sw">IN (Start Work)</button><button class="r" id="bew" data-act="ew">OUT (End Work)</button></div></div>
    <div><b>Break Time</b><div class="bs"><button class="r" id="bsb" data-act="sb">OUT (Start Break)</button><button class="g" id="beb" data-act="eb">IN (End Break)</button></div></div>
  </div>
  <div id="warn" style="display:none;margin:12px 0 0;color:#b45309;font-size:13px"></div>
  <div class="row" style="margin:14px 0 0;font-size:13px;color:#6b7280"><button class="sm" id="pv">◀</button><input type="date" id="d"><button class="sm" id="nx">▶</button><button class="sm" id="td">Today</button><label id="scl"><input type="checkbox" id="sc"> Show cleared entries</label></div>
  <div class="tw"><table style="width:100%"><thead><tr><th>Type</th><th>Start (date &amp; time)</th><th>End (date &amp; time)</th><th>Duration (HH:MM:SS)</th><th>Description</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="cards"><div class="cd"><small>Total Work Time</small><div id="tw"></div></div><div class="cd"><small>Total Break Time</small><div id="tb"></div></div><div class="cd"><small>Net Working Time</small><div id="tn"></div></div></div>
  <button class="ex" style="background:#2b6be0" id="pdf">Export to PDF / Print</button>
  <button class="ex" style="background:#3a7bd5" id="img">Export to Image</button>
  <button class="ex" style="background:#2185c5" id="csv">Export to CSV</button>
  <button class="ex" style="background:#9b2226" id="clr">Clear Sheet</button>
</div>
<div id="rep" style="position:fixed;left:-9999px;top:0"></div>
<div id="fl"><button class="g" data-act="sw">IN Work</button><button class="r" data-act="ew">OUT Work</button><button class="r" data-act="sb">OUT Break</button><button class="g" data-act="eb">IN Break</button></div>
<script type="module">
import {boot,db,collection,doc,addDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,where,logout,esc} from '../../common.js';
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
let col,editing=null,unsub=null,sel,follow=true,dayLogs=[],openLogs=[],editFmt={};
const hms=ms=>{ms=Math.max(0,Math.round(ms/1000));return pad(Math.floor(ms/3600))+':'+pad(Math.floor(ms%3600/60))+':'+pad(ms%60)};
const loc=ms=>ms?new Date(ms-new Date(ms).getTimezoneOffset()*6e4).toISOString().slice(0,19):'';
const fmt=ms=>ms?new Date(ms).toLocaleString('en-US',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}):'-';
const T=l=>l.kind==='work'?'Work':'Break';
const dayOf=ms=>loc(ms).slice(0,10),today=()=>dayOf(Date.now());
sel=today();$('#d').value=sel;$('#out').onclick=logout;
const open=k=>openLogs.find(l=>l.kind===k);
const vis=()=>dayLogs.filter(l=>!l.cleared||sel!==today()||$('#sc').checked);
/* ---- text formatting (edit mode) ---- */
const COL=[['','Text colour'],['#dc2626','Red'],['#16a34a','Green'],['#2563eb','Blue'],['#ea580c','Orange'],['#7c3aed','Purple']],
HL=[['','Highlight'],['#fef08a','Yellow'],['#fecaca','Red'],['#bbf7d0','Green'],['#bfdbfe','Blue'],['#fed7aa','Orange']],SZ=[['','Size'],['s','Small'],['l','Large']];
const css=f=>f?[f.b&&'font-weight:700',f.i&&'font-style:italic',f.c&&'color:'+f.c,f.h&&'background:'+f.h,f.h&&!f.c&&'color:#111',f.z==='l'&&'font-size:1.25em',f.z==='s'&&'font-size:.85em'].filter(Boolean).join(';'):'';
const sp=(l,k,x)=>{const c=css(l.fmt&&l.fmt[k]);return c?`<span style="${esc(c)};padding:1px 6px;border-radius:4px">${x}</span>`:x};
const bar=k=>{const f=editFmt[k]||{},o=(L,v)=>L.map(([x,n])=>`<option value="${x}"${(v||'')===x?' selected':''}>${n}</option>`).join('');
  return `<div class="fb" data-f="${k}"><button class="sm${f.b?' on':''}" data-a="b" title="Bold"><b>B</b></button><button class="sm${f.i?' on':''}" data-a="i" title="Italic"><i>I</i></button><select data-a="c" title="Text colour">${o(COL,f.c)}</select><select data-a="h" title="Highlight">${o(HL,f.h)}</select><select data-a="z" title="Size">${o(SZ,f.z)}</select></div>`};
const cleanFmt=()=>{const o={};for(const k in editFmt){const f=editFmt[k],c={};if(f.b)c.b=true;if(f.i)c.i=true;if(f.c)c.c=f.c;if(f.h)c.h=f.h;if(f.z)c.z=f.z;if(Object.keys(c).length)o[k]=c}return o};
function setF(tr,k,a,v,bt){
  const f=editFmt[k]=editFmt[k]||{};
  if(a==='b'){f.b=!f.b;bt.classList.toggle('on',f.b)}else if(a==='i'){f.i=!f.i;bt.classList.toggle('on',f.i)}else f[a]=v;
  tr.querySelector('[data-k='+k+']').style.cssText=css(f);
}
/* ---- data (saved datewise in Firebase) ---- */
function sub(){
  if(unsub)unsub();editing=null;
  const a=new Date(sel+'T00:00').getTime(),b=new Date(sel+'T23:59:59.999').getTime();
  unsub=onSnapshot(query(col,where('start','>=',a),where('start','<=',b),orderBy('start')),s=>{dayLogs=s.docs.map(d=>({id:d.id,...d.data()}));draw()});
}
boot(u=>{col=collection(db,'timetrack_users',u.uid,'logs');sub();
  onSnapshot(query(col,where('end','==',null)),s=>{openLogs=s.docs.map(d=>({id:d.id,...d.data()}));draw()})});
function setDay(d){sel=d;follow=d===today();$('#d').value=d;sub();draw()}
const shift=n=>{const x=new Date(sel+'T12:00');x.setDate(x.getDate()+n);setDay(dayOf(x.getTime()))};
$('#d').onchange=()=>{if($('#d').value)setDay($('#d').value)};
$('#pv').onclick=()=>shift(-1);$('#nx').onclick=()=>shift(1);$('#td').onclick=()=>setDay(today());$('#sc').onchange=draw;
async function act(a){
  if(sel!==today())setDay(today());
  const now=Date.now(),w=open('work'),b=open('break'),day=dayOf(now);
  if(a==='sw')await addDoc(col,{kind:'work',start:now,end:null,note:'',day});
  if(a==='sb')await addDoc(col,{kind:'break',start:now,end:null,note:'',day});
  if(a==='eb'&&b)await updateDoc(doc(col,b.id),{end:now});
  if(a==='ew'){if(b)await updateDoc(doc(col,b.id),{end:now});if(w)await updateDoc(doc(col,w.id),{end:now})}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled&&!b.closest('table'))act(b.dataset.act)});
function rows(){
  $('#rows').innerHTML=vis().map(l=>{const t=T(l)+(l.cleared?' (cleared)':'');return editing===l.id
    ?`<tr data-id="${l.id}"><td>${t}</td><td><input type="datetime-local" step="1" data-k="start" value="${loc(l.start)}" style="${esc(css(editFmt.start))}">${bar('start')}</td><td><input type="datetime-local" step="1" data-k="end" value="${loc(l.end)}" style="${esc(css(editFmt.end))}">${bar('end')}</td><td>-</td><td><input data-k="note" value="${esc(l.note)}" style="${esc(css(editFmt.note))}">${bar('note')}</td><td><button class="sm" data-a="save">Save</button> <button class="sm" data-a="cancel">Cancel</button></td></tr>`
    :`<tr data-id="${l.id}" class="${l.cleared?'cl':''}"><td>${t}</td><td>${sp(l,'start',fmt(l.start))}</td><td>${sp(l,'end',fmt(l.end))}</td><td class="d" data-s="${l.start}" data-e="${l.end||''}">${hms((l.end||Date.now())-l.start)}</td><td>${sp(l,'note',esc(l.note))}</td><td><button class="sm" data-a="edit">Edit</button> <button class="sm" data-a="del">Delete</button></td></tr>`}
  ).join('')||'<tr><td colspan="6" style="color:#6b7280">No entries for this date</td></tr>';
}
function draw(){
  const W=open('work'),B=open('break'),t=today();
  const dis=(k,v)=>document.querySelectorAll('[data-act='+k+']').forEach(b=>b.disabled=v);dis('sw',!!W);dis('ew',!W);dis('sb',!W||!!B);dis('eb',!B);
  $('#clr').disabled=sel!==t;$('#scl').style.display=sel===t?'':'none';
  const old=openLogs.find(l=>dayOf(l.start)<t);$('#warn').style.display=old?'':'none';
  if(old)$('#warn').textContent='⚠ '+T(old)+' started on '+fmt(old.start)+' is still running. End it with the OUT button, or fix it by editing that day.';
  if(editing===null)rows();tick();
}
function tick(){
  if(follow&&col&&today()!==sel)return setDay(today());
  const now=Date.now();let w=0,b=0;
  vis().forEach(l=>{const d=(l.end||now)-l.start;l.kind==='work'?w+=d:b+=d});
  $('#tw').textContent=hms(w);$('#tb').textContent=hms(b);$('#tn').textContent=hms(w-b);
  $('#dt').textContent=new Date().toDateString();$('#clk').textContent='Local time: '+new Date().toLocaleTimeString('en-GB');
  document.querySelectorAll('td.d').forEach(td=>{if(!td.dataset.e)td.textContent=hms(now-td.dataset.s)});
}
setInterval(tick,1000);tick();
new IntersectionObserver(([e])=>$('#fl').classList.toggle('on',!e.isIntersecting),{threshold:0}).observe(document.querySelector('.panel'));
$('#rows').onclick=async e=>{
  const bt=e.target.closest('button[data-a]');if(!bt)return;const a=bt.dataset.a,tr=bt.closest('tr'),id=tr.dataset.id,fb=bt.closest('.fb');
  if(fb)return setF(tr,fb.dataset.f,a,null,bt);
  if(a==='edit'){editing=id;editFmt=JSON.parse(JSON.stringify((dayLogs.find(x=>x.id===id)||{}).fmt||{}));rows()}
  else if(a==='cancel'){editing=null;rows()}
  else if(a==='del'){if(confirm('Delete this entry?'))deleteDoc(doc(col,id))}
  else if(a==='save'){
    const g=k=>tr.querySelector('[data-k='+k+']').value,s=new Date(g('start')).getTime(),en=g('end')?new Date(g('end')).getTime():null;
    if(!s||(en&&en<s))return alert('Please check the start and end time.');
    await updateDoc(doc(col,id),{start:s,end:en,note:g('note').trim(),day:dayOf(s),fmt:cleanFmt()});editing=null;rows();tick();
  }
};
$('#rows').onchange=e=>{const sl=e.target.closest('.fb select');if(sl)setF(sl.closest('tr'),sl.closest('.fb').dataset.f,sl.dataset.a,sl.value)};
$('#clr').onclick=()=>{
  const L=vis().filter(l=>l.end&&!l.cleared);if(!L.length)return alert('Nothing to clear.');
  if(confirm('Clear today’s sheet? All entries stay saved. Use “Show cleared entries” or pick the date later to see them. Running entries are not cleared.'))L.forEach(l=>updateDoc(doc(col,l.id),{cleared:true}));
};
$('#csv').onclick=()=>{
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',now=Date.now();
  const t=['Type,Start,End,Duration,Description',...vis().map(l=>[T(l),fmt(l.start),fmt(l.end),hms((l.end||now)-l.start),l.note||''].map(q).join(',')),'',q('Total Work Time')+','+q($('#tw').textContent),q('Total Break Time')+','+q($('#tb').textContent),q('Net Working Time')+','+q($('#tn').textContent)].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='time-sheet-'+sel+'.csv';a.click();
};
async function snap(){
  const td=x=>`<td style="border:1px solid #ccc;padding:6px;text-align:center">${x}</td>`,now=Date.now();
  $('#rep').innerHTML=`<div id="rp" style="background:#fff;color:#111;padding:24px;width:820px;font:14px system-ui,sans-serif"><h2 style="margin:0 0 4px;color:#1a7f4b">Staff Work Time Report</h2><div style="color:#555">${new Date(sel+'T12:00').toDateString()}</div><table style="width:100%;border-collapse:collapse;margin:14px 0"><tr style="background:#f1f1f1">${['Type','Start','End','Duration','Description'].map(h=>`<td style="border:1px solid #ccc;padding:6px;text-align:center"><b>${h}</b></td>`).join('')}</tr>${vis().map(l=>`<tr>${td(T(l))}${td(sp(l,'start',fmt(l.start)))}${td(sp(l,'end',fmt(l.end)))}${td(hms((l.end||now)-l.start))}${td(sp(l,'note',esc(l.note)))}</tr>`).join('')}</table><p><b>Total Work Time:</b> ${$('#tw').textContent} &nbsp;&nbsp; <b>Total Break Time:</b> ${$('#tb').textContent} &nbsp;&nbsp; <b>Net Working Time:</b> ${$('#tn').textContent}</p></div>`;
  return html2canvas($('#rp'),{scale:2,backgroundColor:'#fff'});
}
$('#img').onclick=async()=>{const c=await snap(),a=document.createElement('a');a.download='time-report-'+sel+'.png';a.href=c.toDataURL('image/png');a.click()};
$('#pdf').onclick=async()=>{
  const c=await snap(),img=c.toDataURL('image/png'),p=new window.jspdf.jsPDF('p','mm','a4'),w=190,h=c.height*w/c.width;
  let off=0;p.addImage(img,'PNG',10,0,w,h);while(h-off>297){off+=297;p.addPage();p.addImage(img,'PNG',10,-off,w,h)}
  p.save('time-report-'+sel+'.pdf');
};
</script></body></html>
