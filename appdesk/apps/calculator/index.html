<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator</title>
<link rel="stylesheet" href="../../common.css">
<script src="../../firebase-config.js"></script>
<style>
#keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}#keys button{padding:16px 0;font-size:18px}#keys .eq{grid-column:span 2}
#keys .o,#keys .f{background:var(--bg)}#keys .m{font-size:14px;color:var(--ac)}
#mem{height:18px;font-size:12px;color:var(--ac)}#ex{min-height:24px;color:var(--mut);text-align:right;word-break:break-all}#res{font-size:34px;text-align:right;min-height:44px;word-break:break-all}
.h{padding:6px 0;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:8px}.h span{padding:2px 6px;border-radius:6px;cursor:pointer;word-break:break-all}.h span:hover{background:var(--bg)}
@media(min-width:700px){.calc{display:grid;grid-template-columns:340px 1fr;gap:12px;align-items:start}}
</style></head><body>
<h1>🧮 Calculator <button class="sm" id="out">Sign out</button></h1>
<div class="calc"><div class="card"><div id="mem"></div><div id="ex"></div><div id="res"></div><div id="keys"></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><b>History</b><button class="sm" id="ch">Clear</button></div><div class="mut" style="font-size:12px">Tap an expression to edit it, or a result to continue from it.</div><div id="hist"></div></div></div>
<script type="module">
import {boot,db,collection,doc,addDoc,setDoc,getDoc,deleteDoc,onSnapshot,query,orderBy,limit,logout,esc} from '../../common.js';
const $=s=>document.querySelector(s);
let ex='',fresh=false,mem=0,hcol,sref,hist=[];
const fmtNum=v=>String(parseFloat(v.toPrecision(12)));
function evalExpr(src){
  const s=src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/√/g,'sqrt').replace(/\s/g,'');
  const t=s.match(/\d+\.?\d*(?:e[+-]?\d+)?|\.\d+|sqrt|[-+*\/^%()]/g)||[];
  if(t.join('')!==s)throw Error('Bad input');
  let i=0;
  const expr=()=>{let v=term();while(t[i]==='+'||t[i]==='-'){const o=t[i++],r0=term(),r=t[i-1]==='%'?v*r0:r0;v=o==='+'?v+r:v-r}return v};
  const term=()=>{let v=pow();while(t[i]==='*'||t[i]==='/'){const o=t[i++],r=pow();v=o==='*'?v*r:v/r}return v};
  const pow=()=>{const b=unary();if(t[i]==='^'){i++;return Math.pow(b,pow())}return b};
  const unary=()=>{if(t[i]==='-'){i++;return -unary()}if(t[i]==='+'){i++;return unary()}return post()};
  const post=()=>{let v=atom();while(t[i]==='%'){i++;v/=100}return v};
  const atom=()=>{const x=t[i++];if(x===undefined)throw Error('Incomplete');if(x==='('){const v=expr();if(t[i++]!==')')throw Error('Missing )');return v}if(x==='sqrt')return Math.sqrt(atom());if(/^[\d.]/.test(x))return parseFloat(x);throw Error('Bad input')};
  const v=expr();if(i<t.length)throw Error('Bad input');return v;
}
function val(){
  if(!ex)return null;let s=ex;const o=(s.match(/\(/g)||[]).length-(s.match(/\)/g)||[]).length;if(o>0)s+=')'.repeat(o);
  try{const v=evalExpr(s);return isFinite(v)?v:null}catch(e){return null}
}
function show(){
  $('#ex').textContent=ex||'0';const v=val();$('#res').textContent=v==null?'':fmtNum(v);
  $('#mem').textContent=mem?'M = '+fmtNum(mem):'';
}
const saveMem=()=>setDoc(sref,{memory:mem});
function add(k){
  const op=/[+−×÷^]/.test(k);
  if(fresh){if(!op&&k!=='%')ex='';fresh=false}
  ex+=k==='√'?'√(':k;
}
function equals(){
  const v=val();if(v==null){$('#res').textContent='Error';return}
  const r=fmtNum(v);addDoc(hcol,{expr:ex,result:r,ts:Date.now()});ex=r;fresh=true;show();
}
function press(k){
  if(k==='C'){ex='';fresh=false}
  else if(k==='⌫')ex=ex.slice(0,-1);
  else if(k==='=')return equals();
  else if(k==='MC'){mem=0;saveMem()}
  else if(k==='MR'){add(fmtNum(mem))}
  else if(k==='M+'||k==='M−'||k==='MS'){const v=val();if(v==null)return;mem=k==='M+'?mem+v:k==='M−'?mem-v:v;saveMem();fresh=true}
  else add(k);
  show();
}
const KEYS=[['MC','m'],['MR','m'],['M+','m'],['M−','m'],['(',''],[')',''],['^',''],['√','o'],['C','f'],['⌫','f'],['%','o'],['÷','o'],['7',''],['8',''],['9',''],['×','o'],['4',''],['5',''],['6',''],['−','o'],['1',''],['2',''],['3',''],['+','o'],['0',''],['.',''],['=','pri eq']];
$('#keys').innerHTML=KEYS.map(k=>`<button class="${k[1]}" data-k="${k[0]}">${k[0]}</button>`).join('');
$('#keys').onclick=e=>{if(e.target.dataset.k)press(e.target.dataset.k)};
const MAP={'*':'×','/':'÷','-':'−','Enter':'=','=':'=','Backspace':'⌫','Escape':'C','Delete':'C','r':'√','m':'MR'};
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^[0-9.+()%^]$/.test(e.key))press(e.key);else if(MAP[e.key])press(MAP[e.key]);else return;
  e.preventDefault();
});
$('#hist').onclick=e=>{
  const a=e.target.dataset.a,x=hist[e.target.closest('.h')?.dataset.i];if(!a||!x)return;
  if(a==='e')ex=x.expr;else ex=(ex&&/[+−×÷^(]$/.test(ex))?ex+x.result:x.result;
  fresh=false;show();
};
$('#ch').onclick=()=>{if(confirm('Clear all history?'))hist.forEach(x=>deleteDoc(doc(hcol,x.id)))};
$('#out').onclick=logout;
boot(async u=>{
  hcol=collection(db,'calc_users',u.uid,'history');sref=doc(db,'calc_users',u.uid,'state','main');
  try{const s=await getDoc(sref);if(s.exists())mem=s.data().memory||0}catch(e){}
  show();
  onSnapshot(query(hcol,orderBy('ts','desc'),limit(50)),s=>{
    hist=s.docs.map(d=>({id:d.id,...d.data()}));
    $('#hist').innerHTML=hist.map((x,i)=>`<div class="h" data-i="${i}"><span data-a="e">${esc(x.expr)}</span><span data-a="r">= ${esc(x.result)}</span></div>`).join('')||'<div class="mut">No calculations yet</div>';
  });
});
</script></body></html>
