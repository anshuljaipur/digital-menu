    <a href="companies.html" class="nav-link"><span class="nav-icon">🏢</span>Companies</a>

<script src="assets/js/app.js"></script>
<script>
const { buildAlerts, qs, escapeHtml } = IPM;
async function init() {
  const alerts = await buildAlerts();
  qs('#fullAlertList').innerHTML = alerts.map((a) => `
    <div class="alert-item alert-${a.level}">
      <span class="alert-type">${a.type} • ${a.date}</span>
      <span class="alert-text">${escapeHtml(a.text)}</span>
    </div>`).join('') || `<div class="empty-row">You're all caught up — no active alerts 🎉</div>`;
}
init();
</script>
