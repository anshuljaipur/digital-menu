<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro 3D Architecture Studio (Fixed Painting Borders)</title>
    <!-- Three.js Core and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; background-color: #1a202c; color: #fff; overflow: hidden; }
        .app-wrapper { display: flex; height: 100vh; width: 100vw; }
        
        .canvas-container { flex: 2.5; height: 100%; background: #000; position: relative; }
        #rendererCanvas { width: 100%; height: 100%; display: block; }
        
        .sidebar { flex: 1.3; background: #2d3748; padding: 15px; box-sizing: border-box; overflow-y: auto; box-shadow: -5px 0 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 12px; }
        h3 { margin-top: 0; color: #63b3ed; border-bottom: 2px solid #4a5568; padding-bottom: 8px; font-size: 16px; text-align: center; }
        
        .section { background: #1a202c; padding: 12px; border-radius: 8px; border: 1px solid #4a5568; }
        .section-title { font-weight: bold; margin-bottom: 10px; font-size: 13px; color: #fbd38d; border-bottom: 1px solid #2d3748; padding-bottom: 5px;}
        
        .input-group { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
        .input-group div { flex: 1 1 30%; }
        .input-style { padding: 6px; border: 1px solid #4a5568; border-radius: 4px; width: 100%; box-sizing: border-box; font-size: 12px; background: #2d3748; color: #fff; }
        label { font-size: 11px; color: #cbd5e0; display: block; margin-bottom: 4px; font-weight: bold; }
        
        button.action-btn { background-color: #38a169; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 13px; width: 100%; font-weight: bold; margin-top: 5px; }
        button.action-btn:hover { background-color: #2f855a; }
        button.normal-btn { background-color: #3182ce; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 13px; width: 100%; font-weight: bold; margin-top: 5px; }
        button.normal-btn:hover { background-color: #2b6cb0; }
        button.delete-btn { background-color: #e53e3e; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 13px; width: 100%; font-weight: bold; margin-top: 5px; }
        
        .props-panel { background: #2c5282; border: 1px solid #4299e1; display: none; }
        .props-panel.active { display: block; }
        .slider-group { margin-top: 8px; background: #2d3748; padding: 8px; border-radius: 4px; }
        .slider-group label { display: flex; justify-content: space-between; color: #e2e8f0; font-size: 11px; }
        input[type="range"] { width: 100%; margin-top: 5px; cursor: pointer; accent-color: #63b3ed; }

        /* 📋 Object List Styles */
        #objectListContainer { max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .obj-list-item { background: #2d3748; padding: 6px 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid transparent; font-size: 12px; transition: background 0.2s; }
        .obj-list-item:hover { background: #4a5568; }
        .obj-list-item.active { border-color: #63b3ed; background: #2b6cb0; }
        .eye-btn { background: none; border: none; font-size: 14px; cursor: pointer; padding: 0; margin: 0; filter: grayscale(1); }
        .eye-btn:hover { filter: grayscale(0); transform: scale(1.1); }

        @media (max-width: 900px) and (orientation: portrait) {
            body { padding: 10px; box-sizing: border-box; overflow-y: auto; overflow-x: hidden; }
            .app-wrapper { flex-direction: column; height: auto; width: 100%; gap: 12px; }
            .canvas-container { flex: none; height: 50vh; min-height: 400px; width: 100%; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); overflow: hidden; }
            .sidebar { flex: none; max-height: none; width: 100%; border-radius: 10px; padding: 15px; }
            #propsPanel.active { order: -1; border-width: 2px; box-shadow: 0 0 15px rgba(66, 153, 225, 0.5); margin-bottom: 15px; }
        }

        @media (max-height: 600px) and (orientation: landscape), (max-width: 900px) and (orientation: landscape) {
            body { padding: 0; margin: 0; overflow: hidden; }
            .app-wrapper { flex-direction: row; height: 100vh; width: 100vw; gap: 0; border-radius: 0; }
            .canvas-container { flex: 2; height: 100%; border-radius: 0; }
            .sidebar { flex: 1.2; height: 100%; overflow-y: auto; border-radius: 0; padding: 10px; }
            #propsPanel.active { order: -1; border-width: 2px; margin-bottom: 10px; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="canvas-container">
            <div id="rendererCanvas"></div>
        </div>

        <div class="sidebar">
            <h3>🏛️ Pro 3D Architecture Studio</h3>

            <!-- 1. SELECTED ITEM PROPERTIES -->
            <div class="section props-panel" id="propsPanel">
                <div class="section-title" style="color: #fff;">✏️ Selected Item Properties</div>
                
                <!-- Position (Source) -->
                <div style="border-bottom: 1px solid #4a5568; padding-bottom: 5px; margin-bottom: 5px; font-size: 11px; color: #a0aec0;">📍 Position</div>
                <div class="slider-group">
                    <label>↔️ Pos X: <span id="valPropX">0</span>"</label>
                    <input type="range" id="propX" min="-150" max="150" step="1" value="0" oninput="handleSliders()">
                </div>
                <div class="slider-group">
                    <label>↕️ Pos Y: <span id="valPropY">0</span>"</label>
                    <input type="range" id="propY" min="-150" max="150" step="1" value="0" oninput="handleSliders()">
                </div>
                <div class="slider-group">
                    <label>↗️ Pos Z: <span id="valPropZ">0</span>"</label>
                    <input type="range" id="propZ" min="-150" max="150" step="1" value="0" oninput="handleSliders()">
                </div>
                
                <!-- Dimensions (For Objects) -->
                <div id="dimProps">
                    <div style="border-bottom: 1px solid #4a5568; padding-bottom: 5px; margin-bottom: 5px; margin-top: 10px; font-size: 11px; color: #a0aec0;">📏 Dimensions</div>
                    <div class="slider-group">
                        <label>Width (W): <span id="valPropW">0</span>"</label>
                        <input type="range" id="propW" min="5" max="200" step="1" value="0" oninput="handleSliders()">
                    </div>
                    <div class="slider-group">
                        <label>Height (H): <span id="valPropH">0</span>"</label>
                        <input type="range" id="propH" min="5" max="200" step="1" value="0" oninput="handleSliders()">
                    </div>
                </div>

                <!-- Light Focus & Targets (For Lights Only) -->
                <div id="lightPropsAdv" style="display: none;">
                    <div style="border-bottom: 1px solid #4a5568; padding-bottom: 5px; margin-bottom: 5px; margin-top: 10px; font-size: 11px; color: #fbd38d;">🎯 Target Focus Point</div>
                    <div class="slider-group">
                        <label>Target X: <span id="valTX">0</span>"</label>
                        <input type="range" id="propTX" min="-150" max="150" step="1" value="0" oninput="handleSliders()">
                    </div>
                    <div class="slider-group">
                        <label>Target Y: <span id="valTY">0</span>"</label>
                        <input type="range" id="propTY" min="-150" max="150" step="1" value="0" oninput="handleSliders()">
                    </div>
                    <div class="slider-group">
                        <label>Target Z: <span id="valTZ">0</span>"</label>
                        <input type="range" id="propTZ" min="-150" max="150" step="1" value="0" oninput="handleSliders()">
                    </div>
                    
                    <div style="border-bottom: 1px solid #4a5568; padding-bottom: 5px; margin-bottom: 5px; margin-top: 10px; font-size: 11px; color: #fbd38d;">🔆 Light Settings</div>
                    <div class="slider-group">
                        <label>Brightness (Intensity): <span id="valInt">0</span></label>
                        <input type="range" id="propInt" min="0" max="10" step="0.1" value="1" oninput="handleSliders()">
                    </div>
                    <div class="slider-group" id="spotAngleGroup">
                        <label>Focus Area (Cone Angle): <span id="valAngle">0</span>°</label>
                        <input type="range" id="propAngle" min="10" max="90" step="1" value="45" oninput="handleSliders()">
                    </div>
                    
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 5px; font-size:11px; margin-top:10px;">
                        <input type="checkbox" id="propShowMarker" onchange="updateLightMarker()"> Show Light Source Bulb
                    </label>
                </div>

                <!-- Painting Border Settings -->
                <div id="paintingProps" style="display: none; border-top: 1px solid #4299e1; padding-top: 8px; margin-top: 8px;">
                    <div class="section-title" style="font-size: 11px; margin-bottom:5px;">🖼️ Frame / Border Settings</div>
                    <div class="slider-group" style="background: transparent; padding: 0;">
                        <label>🔲 Border Size: <span id="valPropBorderMm">0</span> mm</label>
                        <input type="range" id="propBorderMm" min="0" max="100" step="1" value="15" oninput="handleSliders()">
                    </div>
                    <div class="input-group" style="margin-top: 10px;">
                        <div><label>Color</label><input type="color" id="propBorderColor" class="input-style" style="height:25px; padding:0;" onchange="handleSliders()"></div>
                        <div style="flex: 1 1 60%;"><label>Material</label>
                            <select id="propBorderMat" class="input-style" onchange="handleSliders()">
                                <option value="matte">Matte</option><option value="wood">Wood Finish</option><option value="metal">Brushed Metal</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button class="delete-btn" onclick="deleteActiveObject()">🗑️ Delete Item</button>
            </div>

            <!-- 2. Room Size -->
            <div class="section">
                <div class="section-title">📐 Room Dimensions (in Inches)</div>
                <div class="input-group">
                    <div><label>Width (X)</label><input type="number" id="roomW" class="input-style" value="168"></div>
                    <div><label>Depth (Z)</label><input type="number" id="roomD" class="input-style" value="144"></div>
                    <div><label>Height (Y)</label><input type="number" id="roomH" class="input-style" value="108"></div>
                </div>
                <button class="normal-btn" onclick="buildRoom()">Update Room</button>
            </div>

            <!-- 3. SCENE OBJECT LIST -->
            <div class="section" style="border-color: #9f7aea;">
                <div class="section-title">📋 Scene Object List</div>
                <div id="objectListContainer">
                    <div style="font-size: 11px; color: #a0aec0; text-align: center;">No items added yet.</div>
                </div>
            </div>

            <!-- 4. ADD PAINTING -->
            <div class="section" style="border: 2px solid #3182ce;">
                <div class="section-title">🖼️ Add Painting</div>
                <input type="file" id="paintFile" accept="image/*" class="input-style" style="margin-bottom: 5px;">
                <div class="input-group">
                    <div><label>Wall</label>
                        <select id="paintWall" class="input-style">
                            <option value="front">Front</option><option value="left">Left</option><option value="right">Right</option>
                        </select>
                    </div>
                    <div><label>W (In)</label><input type="number" id="paintW" class="input-style" value="36"></div>
                    <div><label>H (In)</label><input type="number" id="paintH" class="input-style" value="24"></div>
                </div>
                <div class="input-group">
                    <div><label>Border(mm)</label><input type="number" id="frameMm" class="input-style" value="15"></div>
                    <div><label>Color</label><input type="color" id="frameColor" value="#1a1a1a" class="input-style" style="height:28px; padding:0;"></div>
                    <div><label>Material</label>
                        <select id="frameMat" class="input-style">
                            <option value="matte">Matte</option><option value="wood">Wood</option><option value="metal">Metal</option>
                        </select>
                    </div>
                </div>
                <button class="action-btn" onclick="uploadPainting()">✨ Place Painting</button>
            </div>

            <!-- 5. STUDIO LIGHTS -->
            <div class="section" style="border-color: #38a169;">
                <div class="section-title">💡 Add Light Source</div>
                <div class="input-group">
                    <div><label>Type</label>
                        <select id="lightType" class="input-style">
                            <option value="spot">SpotLight (Focus Area)</option><option value="point">PointLight (Omni)</option><option value="directional">Directional</option>
                        </select>
                    </div>
                    <div><label>Color</label><input type="color" id="lightColor" value="#fffaed" class="input-style" style="height:28px; padding:0;"></div>
                </div>
                <button class="action-btn" style="background-color:#319795;" onclick="addStudioLight()">➕ Add Light</button>
            </div>

            <!-- 6. FIXTURES -->
            <div class="section">
                <div class="section-title">🪑 Add Fixtures</div>
                <div class="input-group">
                    <div style="flex: 1 1 100%;"><label>Item Type:</label>
                        <select id="elemType" class="input-style">
                            <option value="window">🪟 Real Window</option><option value="ac">❄️ Split AC</option>
                            <option value="tv">📺 Smart TV</option><option value="sofa">🛋️ Sofa</option><option value="rug">🟫 Rug / Carpet</option>
                        </select>
                    </div>
                </div>
                <div class="input-group">
                    <div><label>Wall</label>
                        <select id="elemWall" class="input-style">
                            <option value="front">Front</option><option value="left">Left</option><option value="right">Right</option>
                        </select>
                    </div>
                    <div><label>W (In)</label><input type="number" id="elemW" class="input-style" value="40"></div>
                    <div><label>H (In)</label><input type="number" id="elemH" class="input-style" value="24"></div>
                </div>
                <button class="normal-btn" onclick="addFixture()">➕ Add Fixture</button>
            </div>

            <!-- 7. SURFACES & TEXTURES -->
            <div class="section">
                <div class="section-title">🎨 Room Surfaces</div>
                <div class="input-group">
                    <div><label>Surface</label>
                        <select id="surfaceSelect" class="input-style">
                            <option value="front">Front Wall</option><option value="left">Left Wall</option>
                            <option value="right">Right Wall</option><option value="floor">Floor</option>
                        </select>
                    </div>
                    <div><label>Color</label><input type="color" id="surfaceColor" value="#5a6974" class="input-style" style="height:25px; padding:0;" oninput="updateSurfaceColor()"></div>
                </div>
                <input type="file" id="textureFile" accept="image/*" class="input-style" style="margin-bottom: 5px;">
                <div class="input-group">
                    <div><label>Mode</label>
                        <select id="texMode" class="input-style" onchange="toggleTileDims()">
                            <option value="fit">Fit to Wall</option><option value="tile">Tile (Repeat)</option>
                        </select>
                    </div>
                </div>
                <div id="tileDims" class="input-group" style="display:none;">
                    <div><label>Tile W (In)</label><input type="number" id="texW" class="input-style" value="24"></div>
                    <div><label>Tile H (In)</label><input type="number" id="texH" class="input-style" value="24"></div>
                </div>
                <label style="cursor: pointer; display: flex; align-items: center; gap: 5px; font-size:11px; margin-top:5px; margin-bottom:8px;">
                    <input type="checkbox" id="texApplyAll"> Apply to All Walls
                </label>
                <div style="display: flex; gap: 5px;">
                    <button class="action-btn" style="margin-top:0;" onclick="uploadTexture()">🎨 Apply Texture</button>
                    <button class="delete-btn" style="margin-top:0;" onclick="removeTexture()">🗑️ Remove</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONSTANTS & SETUP
        // ==========================================
        const INCH_TO_UNIT = 1 / 12;  
        const UNIT_TO_INCH = 12;      
        const MM_TO_UNIT = 0.00328084; 

        const container = document.getElementById('rendererCanvas');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        let roomW_unit = 14, roomD_unit = 12, roomH_unit = 9; 
        let interactableObjects = []; 
        let activeObject = null;
        let objectCounter = 1; 

        const materials = {
            front: new THREE.MeshStandardMaterial({ color: 0x607d8b, roughness: 0.9 }),
            left: new THREE.MeshStandardMaterial({ color: 0x78909c, roughness: 0.9 }),
            right: new THREE.MeshStandardMaterial({ color: 0x78909c, roughness: 0.9 }),
            floor: new THREE.MeshStandardMaterial({ color: 0x8d6e63, roughness: 0.6 })
        };
        const roomWalls = {};

        // ==========================================
        // DYNAMIC ROOM GENERATION 
        // ==========================================
        function buildRoom() {
            for (let key in roomWalls) scene.remove(roomWalls[key]);

            const wIn = parseFloat(document.getElementById('roomW').value) || 168;
            const dIn = parseFloat(document.getElementById('roomD').value) || 144;
            const hIn = parseFloat(document.getElementById('roomH').value) || 108;
            
            roomW_unit = wIn * INCH_TO_UNIT; roomD_unit = dIn * INCH_TO_UNIT; roomH_unit = hIn * INCH_TO_UNIT;

            roomWalls.front = new THREE.Mesh(new THREE.PlaneGeometry(roomW_unit, roomH_unit), materials.front);
            roomWalls.front.position.set(0, 0, -roomD_unit / 2); roomWalls.front.receiveShadow = true;
            
            roomWalls.left = new THREE.Mesh(new THREE.PlaneGeometry(roomD_unit, roomH_unit), materials.left);
            roomWalls.left.position.set(-roomW_unit / 2, 0, 0); roomWalls.left.rotation.y = Math.PI / 2; roomWalls.left.receiveShadow = true;
            
            roomWalls.right = new THREE.Mesh(new THREE.PlaneGeometry(roomD_unit, roomH_unit), materials.right);
            roomWalls.right.position.set(roomW_unit / 2, 0, 0); roomWalls.right.rotation.y = -Math.PI / 2; roomWalls.right.receiveShadow = true;
            
            roomWalls.floor = new THREE.Mesh(new THREE.PlaneGeometry(roomW_unit, roomD_unit), materials.floor);
            roomWalls.floor.position.set(0, -roomH_unit / 2, 0); roomWalls.floor.rotation.x = -Math.PI / 2; roomWalls.floor.receiveShadow = true;

            for (let key in roomWalls) scene.add(roomWalls[key]);

            camera.position.set(0, roomH_unit * 0.1, roomD_unit / 2 + 5);
            controls.target.set(0, 0, -roomD_unit / 6); controls.update();

            document.getElementById('propX').min = -wIn; document.getElementById('propX').max = wIn;
            document.getElementById('propY').min = -hIn; document.getElementById('propY').max = hIn;
            document.getElementById('propZ').min = -dIn; document.getElementById('propZ').max = dIn;
            
            document.getElementById('propTX').min = -wIn; document.getElementById('propTX').max = wIn;
            document.getElementById('propTY').min = -hIn; document.getElementById('propTY').max = hIn;
            document.getElementById('propTZ').min = -dIn; document.getElementById('propTZ').max = dIn;

            interactableObjects.forEach(obj => { if(!obj.userData.isLight) alignObjectToWall(obj); });
        }
        buildRoom();

        // ==========================================
        // 📋 OBJECT LIST MANAGER
        // ==========================================
        function updateObjectListUI() {
            const container = document.getElementById('objectListContainer');
            container.innerHTML = '';
            if(interactableObjects.length === 0) {
                container.innerHTML = '<div style="font-size: 11px; color: #a0aec0; text-align: center;">No items added yet.</div>'; return;
            }
            interactableObjects.forEach((obj) => {
                const div = document.createElement('div');
                div.className = 'obj-list-item';
                if(obj === activeObject) div.classList.add('active');
                
                div.onclick = (e) => {
                    e.stopPropagation(); 
                    if(e.target.tagName === 'BUTTON') return; 
                    setActiveObject(obj);
                    if(window.innerWidth <= 900) document.querySelector('.sidebar').scrollTop = 0;
                };
                
                const nameSpan = document.createElement('span');
                nameSpan.innerText = obj.userData.name || `Object`; nameSpan.style.flex = "1";
                
                const eyeBtn = document.createElement('button');
                eyeBtn.className = 'eye-btn'; eyeBtn.innerHTML = obj.visible ? '👁️' : '🙈';
                eyeBtn.onclick = (e) => {
                    e.stopPropagation(); obj.visible = !obj.visible; eyeBtn.innerHTML = obj.visible ? '👁️' : '🙈';
                    if(!obj.visible && obj === activeObject) clearActiveObject();
                };
                div.appendChild(nameSpan); div.appendChild(eyeBtn); container.appendChild(div);
            });
        }

        // ==========================================
        // RAYCASTING & DYNAMIC PROPERTIES UI
        // ==========================================
        const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
        window.addEventListener('click', (event) => {
            if(event.target.closest('.sidebar')) return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1; mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactableObjects, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object; while(obj.parent && obj.parent.type === "Group") { obj = obj.parent; }
                setActiveObject(obj);
            } else { clearActiveObject(); }
        });

        function setActiveObject(obj) {
            clearActiveObject(); activeObject = obj;
            
            activeObject.traverse(child => { 
                if(child.isMesh && child.material && child.material.emissive && child.userData.isHighlightable !== false) {
                    child.userData.oldEmissive = child.material.emissive.getHex(); child.material.emissive.setHex(0x333333); 
                }
            });

            document.getElementById('propsPanel').classList.add('active');
            
            // Set Source Pos
            const xIn = (activeObject.position.x * UNIT_TO_INCH).toFixed(1); const yIn = (activeObject.position.y * UNIT_TO_INCH).toFixed(1); const zIn = (activeObject.position.z * UNIT_TO_INCH).toFixed(1);
            document.getElementById('propX').value = xIn; document.getElementById('valPropX').innerText = xIn;
            document.getElementById('propY').value = yIn; document.getElementById('valPropY').innerText = yIn;
            document.getElementById('propZ').value = zIn; document.getElementById('valPropZ').innerText = zIn;
            
            const ud = activeObject.userData;

            // TOGGLE UI BASED ON TYPE (LIGHT vs DIMENSIONS)
            if (ud.isLight) {
                document.getElementById('dimProps').style.display = 'none';
                document.getElementById('paintingProps').style.display = 'none';
                document.getElementById('lightPropsAdv').style.display = 'block';
                
                // Populate Light Specific Data
                const engine = ud.lightEngine;
                if(engine.target) {
                    document.getElementById('propTX').value = (engine.target.position.x * UNIT_TO_INCH).toFixed(1); document.getElementById('valTX').innerText = (engine.target.position.x * UNIT_TO_INCH).toFixed(1);
                    document.getElementById('propTY').value = (engine.target.position.y * UNIT_TO_INCH).toFixed(1); document.getElementById('valTY').innerText = (engine.target.position.y * UNIT_TO_INCH).toFixed(1);
                    document.getElementById('propTZ').value = (engine.target.position.z * UNIT_TO_INCH).toFixed(1); document.getElementById('valTZ').innerText = (engine.target.position.z * UNIT_TO_INCH).toFixed(1);
                }
                
                document.getElementById('propInt').value = engine.intensity.toFixed(1); document.getElementById('valInt').innerText = engine.intensity.toFixed(1);
                
                if(ud.lType === 'spot') {
                    document.getElementById('spotAngleGroup').style.display = 'flex';
                    const ang = Math.round(engine.angle * (180 / Math.PI));
                    document.getElementById('propAngle').value = ang; document.getElementById('valAngle').innerText = ang;
                } else {
                    document.getElementById('spotAngleGroup').style.display = 'none';
                }

                document.getElementById('propShowMarker').checked = activeObject.material.visible;
                
            } else {
                document.getElementById('dimProps').style.display = 'block';
                document.getElementById('lightPropsAdv').style.display = 'none';
                
                document.getElementById('propW').value = ud.wIn || 0; document.getElementById('valPropW').innerText = ud.wIn || 0;
                document.getElementById('propH').value = ud.hIn || 0; document.getElementById('valPropH').innerText = ud.hIn || 0;

                if (ud.isPainting) {
                    document.getElementById('paintingProps').style.display = 'block';
                    document.getElementById('propBorderMm').value = ud.borderMm || 15; document.getElementById('valPropBorderMm').innerText = ud.borderMm || 15;
                    document.getElementById('propBorderColor').value = ud.borderColor || "#000000";
                    document.getElementById('propBorderMat').value = ud.borderMat || "matte";
                } else { 
                    document.getElementById('paintingProps').style.display = 'none'; 
                }
            }
            updateObjectListUI();
        }

        function clearActiveObject() {
            if(activeObject) {
                activeObject.traverse(child => { 
                    if(child.isMesh && child.material && child.material.emissive && child.userData.isHighlightable !== false) {
                        child.material.emissive.setHex(child.userData.oldEmissive || 0x000000);
                    }
                });
            }
            activeObject = null; document.getElementById('propsPanel').classList.remove('active'); updateObjectListUI();
        }

        // ==========================================
        // 🌟 MASTER SLIDER HANDLER (ONE FUNCTION FOR ALL)
        // ==========================================
        function handleSliders() {
            if(!activeObject) return;
            const ud = activeObject.userData;

            // 1. Update Source Position
            const xIn = parseFloat(document.getElementById('propX').value); const yIn = parseFloat(document.getElementById('propY').value); const zIn = parseFloat(document.getElementById('propZ').value);
            document.getElementById('valPropX').innerText = xIn.toFixed(1); document.getElementById('valPropY').innerText = yIn.toFixed(1); document.getElementById('valPropZ').innerText = zIn.toFixed(1);
            activeObject.position.set(xIn * INCH_TO_UNIT, yIn * INCH_TO_UNIT, zIn * INCH_TO_UNIT);

            if (ud.isLight) {
                const engine = ud.lightEngine;
                // Target Points
                if(engine.target) {
                    const tx = parseFloat(document.getElementById('propTX').value); const ty = parseFloat(document.getElementById('propTY').value); const tz = parseFloat(document.getElementById('propTZ').value);
                    document.getElementById('valTX').innerText = tx.toFixed(1); document.getElementById('valTY').innerText = ty.toFixed(1); document.getElementById('valTZ').innerText = tz.toFixed(1);
                    engine.target.position.set(tx * INCH_TO_UNIT, ty * INCH_TO_UNIT, tz * INCH_TO_UNIT);
                }
                // Intensity
                const int = parseFloat(document.getElementById('propInt').value);
                document.getElementById('valInt').innerText = int.toFixed(1);
                engine.intensity = int;
                // Angle
                if(ud.lType === 'spot') {
                    const ang = parseFloat(document.getElementById('propAngle').value);
                    document.getElementById('valAngle').innerText = ang;
                    engine.angle = ang * (Math.PI / 180);
                }
            } else {
                // Dimensions
                const newW = parseFloat(document.getElementById('propW').value); const newH = parseFloat(document.getElementById('propH').value);
                document.getElementById('valPropW').innerText = newW.toFixed(1); document.getElementById('valPropH').innerText = newH.toFixed(1);

                if (ud.isPainting) {
                    const bMm = parseFloat(document.getElementById('propBorderMm').value) || ud.borderMm;
                    document.getElementById('valPropBorderMm').innerText = bMm;
                    const bCol = document.getElementById('propBorderColor').value || ud.borderColor; 
                    const bMat = document.getElementById('propBorderMat').value || ud.borderMat;
                    
                    if(newW !== ud.wIn || newH !== ud.hIn || bMm !== ud.borderMm || bCol !== ud.borderColor || bMat !== ud.borderMat) {
                        rebuildPainting(activeObject, newW, newH, bMm, bCol, bMat);
                    }
                } else {
                    activeObject.scale.x = newW / ud.wIn;
                    if (ud.name && ud.name.includes('Rug')) { activeObject.scale.z = newH / ud.hIn; } else { activeObject.scale.y = newH / ud.hIn; }
                }
            }
        }

        function updateLightMarker() { if(activeObject && activeObject.userData.isLight) activeObject.material.visible = document.getElementById('propShowMarker').checked; }

        function deleteActiveObject() {
            if(!activeObject) return; 
            if(activeObject.userData.isLight && activeObject.userData.lightEngine.target) {
                scene.remove(activeObject.userData.lightEngine.target); 
            }
            scene.remove(activeObject);
            interactableObjects = interactableObjects.filter(o => o !== activeObject); clearActiveObject(); updateObjectListUI();
        }

        // ==========================================
        // 🖼️ PAINTING GENERATOR
        // ==========================================
        function alignObjectToWall(obj) {
            const wall = obj.userData.wall; const depth = obj.userData.d_unit || 0.05; 
            if(obj.userData.isFloorItem) {
                obj.position.y = -roomH_unit/2 + depth/2;
                if (wall === 'left') { obj.position.x = -roomW_unit/2 + depth/2; obj.rotation.set(0, Math.PI/2, 0); }
                else if (wall === 'right') { obj.position.x = roomW_unit/2 - depth/2; obj.rotation.set(0, -Math.PI/2, 0); }
                else { obj.position.z = -roomD_unit/2 + depth/2; obj.rotation.set(0, 0, 0); }
            } else {
                obj.position.y = 0; 
                if (wall === 'front') { obj.position.z = -roomD_unit/2 + depth/2; obj.rotation.set(0, 0, 0); }
                else if (wall === 'left') { obj.position.x = -roomW_unit/2 + depth/2; obj.rotation.set(0, Math.PI/2, 0); }
                else if (wall === 'right') { obj.position.x = roomW_unit/2 - depth/2; obj.rotation.set(0, -Math.PI/2, 0); }
            }
        }

        function createFrameMaterial(colorHex, type) {
            let mat = new THREE.MeshStandardMaterial({ color: colorHex });
            if(type === 'wood') { mat.roughness = 0.9; mat.color.offsetHSL(0, -0.2, -0.1); } 
            else if(type === 'metal') { mat.roughness = 0.3; mat.metalness = 0.8; }
            else { mat.roughness = 0.9; mat.metalness = 0.0; } 
            return mat;
        }

        function uploadPainting() {
            const fileInput = document.getElementById('paintFile'); if (!fileInput.files[0]) return alert("Painting image chunein!");
            const wall = document.getElementById('paintWall').value, wIn = parseFloat(document.getElementById('paintW').value) || 36, hIn = parseFloat(document.getElementById('paintH').value) || 24;
            const borderMm = parseFloat(document.getElementById('frameMm').value) || 15, fColor = document.getElementById('frameColor').value, fMat = document.getElementById('frameMat').value;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image(); img.onload = function() {
                    const texture = new THREE.Texture(img); texture.needsUpdate = true;
                    const group = constructPaintingMesh(wIn, hIn, borderMm, fColor, fMat, texture);
                    group.userData = { name: "🖼️ Painting " + (objectCounter++), isPainting: true, wall: wall, wIn: wIn, hIn: hIn, d_unit: 1 * INCH_TO_UNIT, borderMm: borderMm, borderColor: fColor, borderMat: fMat, tex: texture };
                    alignObjectToWall(group); scene.add(group); interactableObjects.push(group); setActiveObject(group); updateObjectListUI();
                }; img.src = e.target.result;
            }; reader.readAsDataURL(fileInput.files[0]);
        }

        function constructPaintingMesh(wIn, hIn, borderMm, color, matType, texture) {
            const group = new THREE.Group();
            const wUnit = wIn * INCH_TO_UNIT, hUnit = hIn * INCH_TO_UNIT, bUnit = borderMm * MM_TO_UNIT, dUnit = 1 * INCH_TO_UNIT;
            const frameMat = createFrameMaterial(color, matType);
            const frameMesh = new THREE.Mesh(new THREE.BoxGeometry(wUnit + bUnit*2, hUnit + bUnit*2, dUnit), frameMat); frameMesh.castShadow = true; group.add(frameMesh);
            const paintMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.9 });
            const artMesh = new THREE.Mesh(new THREE.BoxGeometry(wUnit, hUnit, dUnit + 0.01), paintMat); artMesh.castShadow = true; group.add(artMesh);
            return group;
        }

        function rebuildPainting(obj, newW_In, newH_In, newMm, newColor, newMat) {
            while(obj.children.length > 0){ obj.remove(obj.children[0]); }
            const newGroup = constructPaintingMesh(newW_In, newH_In, newMm, newColor, newMat, obj.userData.tex);
            while(newGroup.children.length > 0) { obj.add(newGroup.children[0]); }
            obj.userData.wIn = newW_In; obj.userData.hIn = newH_In; obj.userData.borderMm = newMm; obj.userData.borderColor = newColor; obj.userData.borderMat = newMat;
        }

        // ==========================================
        // 💡 ADVANCED STUDIO LIGHTS 
        // ==========================================
        function addStudioLight() {
            const type = document.getElementById('lightType').value, color = document.getElementById('lightColor').value;
            let lightSource, lightMarker;
            lightMarker = new THREE.Mesh(new THREE.SphereGeometry(3 * INCH_TO_UNIT, 16, 16), new THREE.MeshBasicMaterial({ color: color })); 
            
            if (type === 'point') { lightSource = new THREE.PointLight(color, 2, 300 * INCH_TO_UNIT); lightSource.castShadow = true; lightMarker.add(lightSource); } 
            else if (type === 'spot') { 
                lightSource = new THREE.SpotLight(color, 2, 400 * INCH_TO_UNIT, Math.PI / 4, 0.5, 1); 
                lightSource.castShadow = true; lightMarker.add(lightSource); 
                scene.add(lightSource.target); 
            } 
            else if (type === 'directional') { 
                lightSource = new THREE.DirectionalLight(color, 2); 
                lightSource.castShadow = true; lightMarker.add(lightSource); 
                scene.add(lightSource.target);
            }

            lightMarker.position.set(0, roomH_unit/2 - (10 * INCH_TO_UNIT), 0); 
            lightMarker.userData = { name: "💡 " + type.toUpperCase() + " Light " + (objectCounter++), isLight: true, lightEngine: lightSource, lType: type };
            lightSource.userData.isHighlightable = false;
            scene.add(lightMarker); interactableObjects.push(lightMarker); setActiveObject(lightMarker); updateObjectListUI();
        }

        // ==========================================
        // 🪑 REALISTIC FIXTURES 
        // ==========================================
        function addFixture() {
            const type = document.getElementById('elemType').value, wall = document.getElementById('elemWall').value;
            const wIn = parseFloat(document.getElementById('elemW').value) || 40, hIn = parseFloat(document.getElementById('elemH').value) || 24;
            const wUnit = wIn * INCH_TO_UNIT, hUnit = hIn * INCH_TO_UNIT; 
            let mesh = new THREE.Group(); let isFloorItem = false, dUnit = 0;

            if (type === 'ac') { 
                dUnit = 8 * INCH_TO_UNIT; 
                const body = new THREE.Mesh(new THREE.BoxGeometry(wUnit, hUnit, dUnit), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 }));
                const vent = new THREE.Mesh(new THREE.BoxGeometry(wUnit*0.8, hUnit*0.15, dUnit+0.05), new THREE.MeshStandardMaterial({ color: 0x222222 }));
                vent.position.y = -hUnit/2 + (hUnit*0.15)/2 + 0.05; 
                mesh.add(body); mesh.add(vent);
            } 
            else if (type === 'tv') { 
                dUnit = 2 * INCH_TO_UNIT; 
                const frame = new THREE.Mesh(new THREE.BoxGeometry(wUnit, hUnit, dUnit), new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 }));
                const screen = new THREE.Mesh(new THREE.PlaneGeometry(wUnit*0.95, hUnit*0.9), new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1, metalness: 0.9 }));
                screen.position.z = dUnit/2 + 0.005; mesh.add(frame); mesh.add(screen);
            } 
            else if (type === 'window') { 
                dUnit = 2 * INCH_TO_UNIT; 
                const frameMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });
                const glassMat = new THREE.MeshStandardMaterial({ color: 0x87CEEB, transparent: true, opacity: 0.3, roughness: 0.1, metalness: 0.8 });
                const glass = new THREE.Mesh(new THREE.PlaneGeometry(wUnit, hUnit), glassMat);
                const ft = 2 * INCH_TO_UNIT;
                const top = new THREE.Mesh(new THREE.BoxGeometry(wUnit, ft, dUnit), frameMat); top.position.y = hUnit/2;
                const bot = new THREE.Mesh(new THREE.BoxGeometry(wUnit, ft, dUnit), frameMat); bot.position.y = -hUnit/2;
                const left = new THREE.Mesh(new THREE.BoxGeometry(ft, hUnit, dUnit), frameMat); left.position.x = -wUnit/2;
                const right = new THREE.Mesh(new THREE.BoxGeometry(ft, hUnit, dUnit), frameMat); right.position.x = wUnit/2;
                mesh.add(glass); mesh.add(top); mesh.add(bot); mesh.add(left); mesh.add(right); 
            } 
            else if (type === 'sofa') {
                isFloorItem = true; dUnit = 24 * INCH_TO_UNIT; const mat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.9 });
                const base = new THREE.Mesh(new THREE.BoxGeometry(wUnit, hUnit*0.4, dUnit), mat); base.position.y = (hUnit*0.4)/2;
                const back = new THREE.Mesh(new THREE.BoxGeometry(wUnit, hUnit*0.6, dUnit*0.2), mat); back.position.set(0, hUnit*0.4 + (hUnit*0.6)/2, -dUnit/2 + (dUnit*0.2)/2);
                mesh.add(base); mesh.add(back);
            } 
            else if (type === 'rug') { 
                isFloorItem = true; dUnit = hUnit; mesh = new THREE.Mesh(new THREE.BoxGeometry(wUnit, 0.02, dUnit), new THREE.MeshStandardMaterial({ color: 0x74b9ff, roughness: 1.0 })); 
            }

            if(mesh) {
                mesh.traverse(child => { if(child.isMesh){ child.castShadow = true; child.receiveShadow = true; }});
                let emoji = type === 'window' ? '🪟' : type === 'sofa' ? '🛋️' : type === 'tv' ? '📺' : type === 'ac' ? '❄️' : '🟫';
                mesh.userData = { name: emoji + " " + type.toUpperCase() + " " + (objectCounter++), wall: wall, isFloorItem: isFloorItem, wIn: wIn, hIn: hIn, d_unit: dUnit };
                alignObjectToWall(mesh); scene.add(mesh); interactableObjects.push(mesh); setActiveObject(mesh); updateObjectListUI();
            }
        }

        // ==========================================
        // TEXTURES
        // ==========================================
        function updateSurfaceColor() { materials[document.getElementById('surfaceSelect').value].color.set(document.getElementById('surfaceColor').value); }
        function toggleTileDims() { document.getElementById('tileDims').style.display = document.getElementById('texMode').value === 'tile' ? 'flex' : 'none'; }
        function removeTexture() {
            const surface = document.getElementById('surfaceSelect').value, applyAll = document.getElementById('texApplyAll').checked;
            if (applyAll && surface !== 'floor') { materials.front.map = null; materials.left.map = null; materials.right.map = null; } 
            else { materials[surface].map = null; materials[surface].needsUpdate = true; }
        }
        let currentTextureImage = null;
        function uploadTexture() {
            const fileInput = document.getElementById('textureFile');
            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image(); img.onload = function() { currentTextureImage = img; applyTexToWall(); }; img.src = e.target.result;
                }; reader.readAsDataURL(fileInput.files[0]);
            } else if (currentTextureImage) { applyTexToWall(); } 
        }
        function applyTexToWall() {
            if (!currentTextureImage) return;
            const surface = document.getElementById('surfaceSelect').value, applyAll = document.getElementById('texApplyAll').checked, mode = document.getElementById('texMode').value;
            const applyTex = (surfName) => {
                const tex = new THREE.Texture(currentTextureImage);
                if (mode === 'tile') {
                    const tileW = parseFloat(document.getElementById('texW').value) || 24, tileH = parseFloat(document.getElementById('texH').value) || 24;
                    let surfW_in = 0, surfH_in = 0;
                    if (surfName === 'front') { surfW_in = roomW_unit*UNIT_TO_INCH; surfH_in = roomH_unit*UNIT_TO_INCH; } else if (surfName === 'left' || surfName === 'right') { surfW_in = roomD_unit*UNIT_TO_INCH; surfH_in = roomH_unit*UNIT_TO_INCH; } else { surfW_in = roomW_unit*UNIT_TO_INCH; surfH_in = roomD_unit*UNIT_TO_INCH; }
                    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(surfW_in / tileW, surfH_in / tileH);
                } else { tex.wrapS = THREE.ClampToEdgeWrapping; tex.wrapT = THREE.ClampToEdgeWrapping; tex.repeat.set(1, 1); }
                tex.needsUpdate = true; materials[surfName].map = tex; materials[surfName].needsUpdate = true;
            };
            if (applyAll && surface !== 'floor') { applyTex('front'); applyTex('left'); applyTex('right'); } else { applyTex(surface); }
        }

        window.addEventListener('resize', () => { 
            const newWidth = document.querySelector('.canvas-container').clientWidth; const newHeight = document.querySelector('.canvas-container').clientHeight;
            camera.aspect = newWidth / newHeight; camera.updateProjectionMatrix(); renderer.setSize(newWidth, newHeight); 
        });
        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        animate();
    </script>
</body>
</html>
